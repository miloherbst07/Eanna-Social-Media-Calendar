<style>
:root{
  --navy:#1C2070; --navy-deep:#120B50; --orange:#FF5A00; --burnt:#C4520F;
  --bg:#F3F4F9; --surface:#FFFFFF; --surface-2:#F7F8FC; --ink:#15173D; --muted:#5E6389;
  --line:#DDE0EE; --line-strong:#C6CAE0; --tip:#FFF1E8; --tip-line:#FFC9A8; --focus:#FF5A00;
  --shadow:0 1px 2px rgba(18,11,80,.06),0 4px 14px rgba(18,11,80,.06);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C0E28; --surface:#15183B; --surface-2:#1A1E47; --ink:#EDEFFA; --muted:#A3A8CF;
    --line:#282D62; --line-strong:#373D7A; --tip:#2A1E2E; --tip-line:#6B3A2A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0C0E28; --surface:#15183B; --surface-2:#1A1E47; --ink:#EDEFFA; --muted:#A3A8CF;
  --line:#282D62; --line-strong:#373D7A; --tip:#2A1E2E; --tip-line:#6B3A2A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 140px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img{max-width:100%;display:block}

/* Gate (same as calendar) */
.gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(120% 90% at 20% 10%,#2A2F9A 0%,var(--navy) 40%,var(--navy-deep) 100%);color:#fff}
.gate[hidden]{display:none}
.gate::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--orange),var(--burnt))}
.gate-card{width:100%;max-width:420px;text-align:center}
.gate-card img{width:170px;height:auto;margin:0 auto 14px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.4))}
.gate-card h1{font-family:var(--display);font-style:italic;font-weight:800;font-size:40px;line-height:1;margin:0 0 12px}
.gate-card p{margin:0 0 22px;opacity:.85;font-size:15.5px}
.gate-acts{display:flex;flex-direction:column;gap:10px;align-items:center}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:250px;padding:12px 18px;border-radius:10px;border:0;font-weight:700;font-size:15.5px;background:#fff;color:#15173D;text-decoration:none}
.gbtn.plain{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);font-weight:600}
.gbtn svg{width:18px;height:18px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:var(--orange);animation:spin .8s linear infinite;margin:6px auto 0}
@keyframes spin{to{transform:rotate(360deg)}}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(100deg,var(--navy) 0%,var(--navy-deep) 100%);color:#fff}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,var(--orange),var(--burnt))}
.top-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px 0}
.brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:#fff}
.brand img{height:46px;width:auto;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.brand-text{display:flex;flex-direction:column;line-height:1}
.brand-text strong{font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;letter-spacing:.2px}
.brand-text span{font-size:12.5px;opacity:.75;margin-top:3px}
.toCal{margin-left:auto;display:inline-flex;align-items:center;gap:7px;color:#fff;text-decoration:none;font-weight:600;font-size:14.5px;padding:8px 13px;border-radius:9px;background:rgba(255,255,255,.12)}
.toCal:hover{background:rgba(255,255,255,.2)}
.toCal svg{width:16px;height:16px}
.tabs{max-width:1400px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:8px 14px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;color:rgba(255,255,255,.72);text-decoration:none;padding:10px 13px 12px;border-radius:8px 8px 0 0;font-weight:600;font-size:15px;white-space:nowrap}
.tab:hover{color:#fff;background:rgba(255,255,255,.08)}
.tab[aria-current="page"]{color:#fff;background:rgba(255,255,255,.14);box-shadow:inset 0 -3px 0 var(--orange)}
.tab small{font-weight:500;opacity:.6;font-size:12px;margin-left:4px}

main{max-width:1200px;margin:0 auto;padding:30px 20px 80px}
.view[hidden]{display:none}

/* Page intro */
.intro{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:28px;align-items:start;margin-bottom:26px}
.kicker{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--burnt);margin-bottom:6px}
:root[data-theme="dark"] .kicker{color:#FF8A4C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kicker{color:#FF8A4C}}
h1.title{font-family:var(--display);font-style:italic;font-weight:800;font-size:52px;line-height:.95;margin:0 0 14px;letter-spacing:.2px}
.lead{font-size:18.5px;line-height:1.55;max-width:64ch;margin:0 0 10px}
.facts{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);font-size:15px}
.facts h3{margin:0 0 8px;font-size:15px}
.facts dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.facts dt{color:var(--muted);font-weight:600}
.facts dd{margin:0}
.facts dd a{color:var(--orange);font-weight:600}

/* Contents */
.toc{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 34px;padding:0;list-style:none}
.toc a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:99px;padding:6px 14px 6px 6px;font-weight:600;font-size:14px}
.toc a:hover{border-color:var(--orange)}
.toc a b{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;display:inline-grid;place-items:center;font-size:12.5px}
:root[data-theme="dark"] .toc a b{background:#3A40A0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toc a b{background:#3A40A0}}

/* Lesson */
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:34px;align-items:start;padding:34px 0;border-top:1px solid var(--line)}
.lesson.two{grid-template-columns:minmax(0,1fr) 300px 300px}
.lesson.three{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:24px}
.lesson.wide,#dv-keys{grid-template-columns:1fr;gap:20px}
kbd{display:inline-block;font-family:var(--body);font-weight:700;font-size:.86em;line-height:1.5;background:var(--surface);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:6px;padding:0 6px;min-width:1.6em;text-align:center;white-space:nowrap}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin:8px 0 16px}
.kblock{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kblock h3{margin:0 0 8px;font-size:16px;color:var(--burnt)}
.ktable{width:100%;border-collapse:collapse;font-size:15px}
.ktable td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ktable tr:last-child td{border-bottom:0}
.ktable td:first-child{white-space:nowrap;padding-right:14px;width:1%}
#keys-cv .ktable td:first-child,#keys-lr .ktable td:first-child,#keys-mac .ktable td:first-child,#keys-phone .ktable td:first-child{white-space:normal;width:46%;line-height:1.9}
.kc{white-space:nowrap}
.lesson.wide figure{max-width:1100px;width:100%}
.lesson.wide .shot{border-radius:12px;box-shadow:0 8px 26px rgba(18,11,80,.16)}
.lesson.three .txt{grid-column:1/-1}
.lesson.three figure{max-width:300px;width:100%;justify-self:center}
.lesson h2{display:flex;align-items:baseline;gap:12px;font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;margin:0 0 12px}
.lesson h2 .n{font-style:italic;font-weight:800;color:var(--orange);font-size:40px;min-width:1.2em}
.lesson p{margin:0 0 14px;max-width:66ch}
.lesson ol,.lesson ul{margin:0 0 14px;padding-left:22px;max-width:64ch}
.lesson li{margin-bottom:6px}
.tip{background:var(--tip);border:1px solid var(--tip-line);border-left:5px solid var(--orange);border-radius:10px;padding:12px 14px;margin:6px 0 0;max-width:66ch;font-size:15.5px}
.tip strong{color:var(--burnt)}
:root[data-theme="dark"] .tip strong{color:#FF8A4C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tip strong{color:#FF8A4C}}
figure{margin:0}
.shot{display:block;padding:0;border:0;background:none;width:100%;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(18,11,80,.18);cursor:zoom-in;position:relative}
.shot img{width:100%;height:auto}
.shot::after{content:"Tap to enlarge";position:absolute;right:10px;top:10px;background:rgba(18,11,80,.82);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;opacity:0;transition:opacity .15s}
.shot:hover::after,.shot:focus-visible::after{opacity:1}
figcaption{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
kbd,.ui{font-family:var(--body);font-weight:700;font-size:.92em;background:var(--surface);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:6px;padding:0 6px;white-space:nowrap}

/* Checklist */
.check{list-style:none;padding:0!important;margin:0 0 14px}
.check li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--orange);flex:none}
.check label{cursor:pointer}
.check li.done label{color:var(--muted);text-decoration:line-through}

/* Coming soon */
.soon{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow);max-width:780px}
.soon .badge{display:inline-block;background:var(--tip);color:var(--burnt);border:1px solid var(--tip-line);font-weight:700;font-size:13px;padding:2px 10px;border-radius:99px;margin-bottom:10px}
.soon ul{margin:6px 0 0;padding-left:22px}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:80;background:rgba(8,6,30,.92);display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.lb.open{display:flex}
.lb img{max-height:100%;max-width:100%;width:auto;border-radius:12px}
.lb button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;background:rgba(255,255,255,.14);border:0;color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px}
.lb button:hover{background:rgba(255,255,255,.26)}
.lb .lbnav{top:50%;transform:translateY(-50%);width:52px;height:52px;font-size:26px}
.lb #lbprev{left:14px;right:auto}
.lb #lbnext{right:14px}
.lb .lbnav[hidden]{display:none}
.lbcount{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);color:#fff;font-weight:600;font-size:14px;background:rgba(255,255,255,.14);padding:4px 12px;border-radius:99px}
.lbcount:empty{display:none}

/* Slider for lessons with more than one screenshot */
.carousel{position:relative;min-width:0;width:100%}
.lesson .carousel{max-width:300px;justify-self:center}
.lesson.wide .carousel{max-width:1100px;justify-self:stretch}
.ctrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;gap:16px;border-radius:18px}
.ctrack::-webkit-scrollbar{display:none}
.ctrack figure{flex:0 0 100%;scroll-snap-align:center;min-width:0}
.ctrack .shot{box-shadow:none}
.lesson .carousel{filter:drop-shadow(0 10px 22px rgba(18,11,80,.16))}
.cbtn{position:absolute;top:calc(50% - 32px);width:44px;height:44px;border-radius:50%;border:0;background:rgba(18,11,80,.82);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center;z-index:2;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.cbtn:hover{background:var(--orange)}
.cbtn:disabled{opacity:0;pointer-events:none}
.cbtn.prev{left:-14px}.cbtn.next{right:-14px}
.lesson.wide .cbtn.prev{left:10px}.lesson.wide .cbtn.next{right:10px}
.cfoot{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.cdots{display:flex;gap:6px}
.cdots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:var(--line-strong)}
.cdots button[aria-current="true"]{background:var(--orange);width:22px;border-radius:99px}
.ccount{font-size:13px;color:var(--muted);font-weight:600}
.lesson.has-car{grid-template-columns:minmax(0,1fr) 320px}
.lesson.wide.has-car{grid-template-columns:1fr}
@media (prefers-reduced-motion:reduce){.ctrack{scroll-behavior:auto}}

/* Photo gallery */
.gfilters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.gfilters button{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px}
.gfilters button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.gsec{margin:0 0 34px}
.gsec h2{font-family:var(--display);font-weight:700;font-size:30px;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
.gsec h2 small{font-family:var(--body);font-size:14px;color:var(--muted);font-weight:600}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.ggrid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.gitem{border:0;padding:0;background:none;text-align:left;cursor:zoom-in;color:var(--ink)}
.gitem .gimg{display:block;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:9/16}
.ggrid.wide .gitem .gimg{aspect-ratio:16/12}
.gitem img{width:100%;height:100%;object-fit:cover;object-position:top}
.gitem:hover .gimg{border-color:var(--orange)}
.gitem span.gcap{display:block;font-size:13px;font-weight:600;margin-top:6px;line-height:1.3}
.gitem span.glesson{display:block;font-size:12px;color:var(--muted)}

.foot{color:var(--muted);font-size:13.5px;margin-top:40px;border-top:1px solid var(--line);padding-top:16px}

@media (max-width:980px){
  .lesson,.lesson.two{grid-template-columns:minmax(0,1fr) 260px}
  .lesson.two figure+figure{grid-column:2}
}
@media (max-width:760px){
  .top-inner{padding:10px 14px 0}
  .brand img{height:38px}
  .brand-text strong{font-size:21px}
  .toCal span{display:none}
  main{padding:22px 16px 70px}
  h1.title{font-size:42px}
  .lead{font-size:17px}
  .intro{grid-template-columns:1fr}
  .lesson,.lesson.two{grid-template-columns:1fr;gap:18px;padding:28px 0}
  .lesson figure{max-width:330px;width:100%;margin:0 auto}
  .lesson.two{grid-template-columns:1fr 1fr}
  .lesson.two .txt{grid-column:1/-1}
  .lesson.three{grid-template-columns:1fr}
  .lesson.three figure{max-width:330px}
  .lesson.wide figure{max-width:none}
  .lesson.two figure{max-width:none}
  .lesson h2{font-size:30px}
  .lesson.has-car{grid-template-columns:1fr}
  .lesson .carousel{max-width:330px}
  .lesson.wide .carousel{max-width:none}
  .cbtn.prev{left:4px}.cbtn.next{right:4px}
  .ggrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ggrid.wide{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.5s}}

.tree,.tree ul{list-style:none;padding-left:0;margin:0}.tree{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px!important;margin:6px 0 18px;max-width:880px;font-size:15px}.tree ul{padding-left:22px;border-left:2px solid var(--line-strong);margin:4px 0 4px 6px}.tree li{padding:3px 0}
.golink{display:inline-flex;align-items:center;gap:6px;background:var(--orange);color:#fff!important;font-weight:700;text-decoration:none;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow)}.golink:hover{background:var(--burnt)}
.stable{width:100%;max-width:880px;border-collapse:collapse;font-size:15px;margin:6px 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stable th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line-strong)}
.stable td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.stable tr:last-child td{border-bottom:0}
.stable td:first-child{min-width:130px}
.lesson h3.sub{font-size:18px;margin:22px 0 8px;color:var(--burnt)}

  <section class="intro">
    <div>
      <div class="kicker">Section 1 · Video editing on your phone</div>
      <h1 class="title">Instagram Edits</h1>
      <p class="lead">Edits is Instagram's free editing app, and it's what we use for most quick club content: trends, player clips, game-day videos and anything that needs to go up fast. It edits in the vertical 9:16 shape Reels need, can reframe landscape game footage to fit, and posts straight to the Éanna Instagram and Facebook pages, so the video keeps its quality and nothing gets lost in a download-and-reupload.</p>
      <p class="lead">Work through the lessons in order. Each one has a screenshot from our own account. The orange numbers match the key underneath, and you can tap any screenshot to see it full size.</p>
    </div>
    <aside class="facts">
      <h3>At a glance</h3>
      <dl>
        <dt>Cost</dt><dd>Free</dd>
        <dt>Device</dt><dd>iPhone and Android</dd>
        <dt>Account</dt><dd>Sign in with the Éanna Instagram account (ask Milo)</dd>
        <dt>Use it for</dt><dd>Reels, trends, player content, quick game-day clips</dd>
        <dt>Not for</dt><dd>Long highlight packages (use DaVinci Resolve)</dd>
      </dl>
    </aside>
  </section>

  <ol class="toc" id="toc-edits"></ol>

  <article class="lesson" id="edits-add" data-title="Adding clips">
    <div class="txt">
      <h2><span class="n">1</span>Start a project and add clips</h2>
      <p>Open Edits, start a new project and pick your clips from your camera roll. They line up along the <strong>main track</strong>, the long strip of thumbnails across the middle, in the order you picked them. That's the backbone of your video.</p>
      <p>To add more clips later, tap the <span class="ui">+</span> at the end of the timeline. You get three choices: <strong>Reels</strong> pulls in a clip from Instagram, <strong>Camera</strong> lets you film something there and then, and <strong>Gallery</strong> takes it from your phone.</p>
      <p>If you want a clip <em>on top of</em> the video instead of after it, like a reaction in the corner or a logo, use <span class="ui">Overlay</span> in the bottom toolbar. Lesson 4 covers overlays.</p>
      <p class="tip"><strong>Éanna tip:</strong> always film vertically. Turning a landscape clip into a Reel means losing most of the picture.</p>
    </div>
    <figure><button class="shot"><img src="learn/edits/edits-01-add-clips.jpg" width="900" height="2398" loading="lazy" alt="Edits timeline with the plus button, the Add from menu showing Reels, Camera and Gallery, and the Overlay button highlighted"></button></figure>
  </article>

  <article class="lesson" id="edits-split" data-title="Cutting with Split">
    <div class="txt">
      <h2><span class="n">2</span>Cutting with Split</h2>
      <p>Edits doesn't have a "cut" button. You cut by <strong>splitting</strong> a clip in two and deleting the bit you don't want.</p>
      <ol>
        <li>Scroll the timeline until the white <strong>playhead</strong> line sits exactly where you want the cut.</li>
        <li>Tap the clip to select it. It gets a yellow outline. Split only cuts the clip that's selected.</li>
        <li>Tap <span class="ui">Split</span>. You now have two clips.</li>
        <li>Select the piece you don't want and tap <span class="ui">Delete</span>.</li>
      </ol>
      <p>To shave a little off the start or end of a clip, drag the yellow handles on either side of the selected clip instead.</p>
      <p class="tip"><strong>Éanna tip:</strong> cut on the action. Start a highlight just before the move begins, and cut on the beat of the music so the edit feels sharp.</p>
    </div>
    <figure><button class="shot"><img src="learn/edits/edits-02-split.jpg" width="900" height="2463" loading="lazy" alt="Edits timeline showing the playhead, a selected clip with a yellow outline, and the Split and Delete buttons"></button></figure>
  </article>

  <article class="lesson" id="edits-audio" data-title="Audio">
    <div class="txt">
      <h2><span class="n">3</span>Audio: extracting it and using Instagram sounds</h2>
      <p>Every video clip carries its own sound. Select the clip, then tap <span class="ui">Extract audio</span>, and the sound is pulled out onto its own pink track. Now you can trim it, move it, fade it out or delete it without touching the picture. It's perfect for keeping a player's voice from one clip playing over the next shot, or for removing gym noise.</p>
      <p>Audio tracks always show in pink. Music you've added from Instagram shows with its name, like "Original audio."</p>
      <p><strong>Getting audio from Instagram:</strong> when you hear a sound on a Reel you want to use, tap the audio name at the bottom of the Reel and save it. Then in Edits, tap <span class="ui">Audio</span> in the bottom toolbar, and you'll find your saved sounds there alongside trending audio.</p>
      <p class="tip"><strong>Éanna tip:</strong> save sounds while logged in as the club account. Business accounts get a smaller music library than personal ones, so a song that works on your own account might not be available for the club.</p>
    </div>
    <figure><button class="shot"><img src="learn/edits/edits-03-extract-audio.jpg" width="900" height="2440" loading="lazy" alt="A selected clip with the Extract audio button and the pink audio track highlighted"></button></figure>
  </article>

  <article class="lesson two" id="edits-overlay" data-title="Overlays">
    <div class="txt">
      <h2><span class="n">4</span>Overlays, the main track and Transform</h2>
      <p>An <strong>overlay</strong> is a clip or photo that sits on its own line <em>above</em> the main video, so both play at the same time. Use overlays for picture-in-picture, like a player reacting to their own highlight, or for putting a logo or graphic over footage.</p>
      <p>Tap the overlay to select it and the toolbar changes:</p>
      <ul>
        <li><span class="ui">Main track</span> swaps the overlay into the main video line so it plays full screen. Tap it on a main clip to send it back up to an overlay.</li>
        <li><span class="ui">Transform</span> sets the overlay's size and position. Pick <strong>Scale</strong> to resize, <strong>Position</strong> to move it and <strong>Rotation</strong> to turn it, drag the dial, then tap the tick. You can also just pinch and drag the overlay on the preview with your fingers.</li>
      </ul>
      <p class="tip"><strong>Éanna tip:</strong> keep overlays out of the bottom fifth and right-hand edge of the screen. That's where Instagram puts the caption and the like and comment buttons.</p>
    </div>
    <figure><button class="shot"><img src="learn/edits/edits-04-overlay-main-track.jpg" width="900" height="2440" loading="lazy" alt="A selected overlay clip with the Transform and Main track buttons highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/edits/edits-05-transform.jpg" width="900" height="2463" loading="lazy" alt="Transform panel with Scale, Position and Rotation tabs, the adjustment dial and the confirm tick"></button></figure>
  </article>

  <article class="lesson three" id="edits-reframe" data-title="Landscape to vertical">
    <div class="txt">
      <h2><span class="n">5</span>Turning landscape footage vertical</h2>
      <p>Most game footage is filmed landscape: the main camera, the stream, wide shots from the stand. Dropped into a 9:16 Reel, it only fills a thin strip across the middle with black bars above and below, and on a phone the players look tiny. <strong>Zooming in to fill more of the frame</strong> makes the play bigger, easier to follow, and better suited to social media.</p>
      <ol>
        <li>Tap the clip on the timeline to select it.</li>
        <li><strong>Pinch out</strong> with two fingers on the preview to zoom in. The number under the preview shows how far you've zoomed (e.g. 1.64x).</li>
        <li><strong>Drag with one finger</strong> to move the clip so the ball and the players involved stay in the frame. The yellow box shows the whole clip, and anything outside the frame gets cropped off.</li>
        <li>For exact numbers, use <span class="ui">Transform</span> instead (Scale and Position, from lesson 4).</li>
      </ol>
      <p><strong>It doesn't always have to be done, but do it when you can.</strong> Skip it, or only zoom part of the way, when:</p>
      <ul>
        <li>zooming would cut off the ball, the basket or a player who matters to the play</li>
        <li>the footage starts looking blurry. HD footage softens quickly past about 2x, while 4K footage holds up much better.</li>
        <li>the play moves right across the court. Split the clip and reposition each part, or leave it wider.</li>
      </ul>
      <p><strong>Bringing DaVinci edits into Edits:</strong> bigger edits like highlight packages are often cut in DaVinci Resolve on a Mac, usually in landscape. Export the finished video, AirDrop it to your phone, then open it in Edits to reframe it for vertical, add text in the saved Éanna style, and post it from there. That keeps the finishing touches, posting and insights all in one place for every video, whichever app it started in. The DaVinci section will show how to export and AirDrop.</p>
      <p class="tip"><strong>Éanna tip:</strong> when exporting from DaVinci for this, export in the highest quality you filmed in (4K if you have it), so there's detail left to zoom into.</p>
    </div>
    <figure><button class="shot"><img src="learn/edits/edits-13-reframe-before.jpg" width="900" height="2292" loading="lazy" alt="A landscape clip in the vertical frame with black bars above and below"></button></figure>
    <figure><button class="shot"><img src="learn/edits/edits-14-reframe-zoom.jpg" width="900" height="2356" loading="lazy" alt="Pinching to zoom the clip in, with the zoom level shown under the preview"></button></figure>
    <figure><button class="shot"><img src="learn/edits/edits-15-reframe-after.jpg" width="900" height="2333" loading="lazy" alt="The clip zoomed and dragged into position, with X and Y position shown"></button></figure>
  </article>

  <article class="lesson two" id="edits-text" data-title="Text">
    <div class="txt">
      <h2><span class="n">6</span>Text that's on-brand and easy to read</h2>
      <p>Tap <span class="ui">Text</span> in the bottom toolbar and type your words. The row of icons across the top of the text panel controls everything else: the pencil edits the words, <span class="ui">Aa</span> picks the font, the colour circle sets the colour, the lines-and-A icon sets alignment, and the circled A adds an outline or background.</p>
      <p><strong>Saved styles keep every video looking like Éanna.</strong> Once a piece of text looks right, tap the small bookmark on the text box to save that style. It then lives in the <strong>Saved</strong> tab (the bookmark at the start of the font list), so next time it's one tap. Everyone on the team should use the same saved style.</p>
      <p><strong>Making text pop:</strong> footage from a busy gym makes plain white text hard to read. Tap the circled A and choose <strong>Outline</strong> or <strong>Background</strong>. A black background box is the most readable option and works on any footage.</p>
      <p class="tip"><strong>Éanna tip:</strong> double-check the spelling of every player's name, and keep text in the middle of the screen, clear of Instagram's buttons.</p>
    </div>
    <figure><button class="shot"><img src="learn/edits/edits-06-text-saved-styles.jpg" width="900" height="2587" loading="lazy" alt="Text panel showing the save-style bookmark, the Saved tab, a saved style and the row of text tools"></button></figure>
    <figure><button class="shot"><img src="learn/edits/edits-07-text-pop.jpg" width="900" height="2292" loading="lazy" alt="Text style options: None, Outline, Inverted outline, Background and Inverted background"></button></figure>
  </article>

  <article class="lesson" id="edits-effects" data-title="Effects and Sound FX">
    <div class="txt">
      <h2><span class="n">7</span>Effects and Sound FX</h2>
      <p><span class="ui">Effects</span> adds visual effects to the selected clip, like shake, zoom, glitch or blur. Used once at the right moment, such as a big dunk, a block or the final buzzer, they add punch. Used on every clip, they make a video feel messy.</p>
      <p><span class="ui">Sound FX</span> opens a library of sound effects, like swooshes, hits, whooshes and crowd noise. They're dropped in wherever the playhead is, so line it up first. A swoosh on a transition or a crowd roar on a big play makes clips feel more alive. For funnier sounds, see the Sounds, quotes and GIFs section.</p>
      <p class="tip"><strong>Éanna tip:</strong> keep sound effects quieter than the voice or music, and use one or two per video, not ten.</p>
    </div>
    <figure><button class="shot"><img src="learn/edits/edits-08-effects-sound-fx.jpg" width="900" height="2375" loading="lazy" alt="Bottom toolbar with the Effects and Sound FX buttons highlighted"></button></figure>
  </article>

  <article class="lesson two" id="edits-export" data-title="Export settings">
    <div class="txt">
      <h2><span class="n">8</span>Export settings, and why "HD is best"</h2>
      <p>Before you post, tap the quality label at the top of the screen (it says <span class="ui">HD</span>) to open the export settings:</p>
      <ul>
        <li><strong>Resolution:</strong> match your footage. Most phone clips are HD, so choose HD.</li>
        <li><strong>Frame rate:</strong> match what you filmed. An iPhone films at 30 by default, so leave it on 30 unless you filmed at something else.</li>
        <li><strong>Colour:</strong> SDR keeps colours the same on every phone. HDR can look extra bright next to other posts in the feed.</li>
      </ul>
      <p><strong>If Edits says "HD is the best fit for this video," it's right.</strong> Your footage was filmed in HD, and exporting in 4K can't add detail that was never filmed. It just stretches the same picture into a much bigger file that takes longer to upload, and Instagram shrinks it back down anyway. Tap <span class="ui">Export in HD</span>.</p>
      <p class="tip"><strong>Éanna tip:</strong> only pick 4K if the clips were actually filmed in 4K, and even then HD looks the same on a phone.</p>
    </div>
    <figure><button class="shot"><img src="learn/edits/edits-09-export-settings.jpg" width="900" height="2546" loading="lazy" alt="Export settings: resolution HD, 2K, 4K; frame rate 24, 30, 60; colour SDR or HDR"></button></figure>
    <figure><button class="shot"><img src="learn/edits/edits-10-hd-is-best.jpg" width="900" height="2333" loading="lazy" alt="Pop-up saying HD is the best fit for this video, with Export in HD highlighted"></button></figure>
  </article>

  <article class="lesson" id="edits-post" data-title="Posting">
    <div class="txt">
      <h2><span class="n">9</span>Posting to Instagram and Facebook, and downloading</h2>
      <p>Tap <span class="ui">Next</span> and you'll see <strong>Choose where to share</strong>:</p>
      <ul>
        <li><span class="ui">Instagram</span> or <span class="ui">Facebook</span> takes the video straight to that page, where you add the caption, cover image and tags, then post. To get it on both, post to one, then come back to this screen and tap the other. Or schedule both at once from Meta Business Suite (see the Business Suite section).</li>
        <li><span class="ui">Download</span> saves the finished video to your phone. Do this every single time, even if you've already posted, so there's a copy to back up to the club Google Drive.</li>
      </ul>
      <p class="tip"><strong>Éanna tip:</strong> once it's posted, open the Media Calendar and mark the post as Posted. The reminder to add its stats then appears 24 hours later.</p>
    </div>
    <figure><button class="shot"><img src="learn/edits/edits-11-share-download.jpg" width="900" height="2333" loading="lazy" alt="Choose where to share screen with the Instagram, Facebook and Download buttons highlighted"></button></figure>
  </article>

  <article class="lesson" id="edits-insights" data-title="Insights">
    <div class="txt">
      <h2><span class="n">10</span>Insights: what the numbers mean</h2>
      <p>Tap the chart icon in the bottom bar to open <strong>Insights</strong> for the club account.</p>
      <ul>
        <li><strong>Date range</strong> (top right): switch between periods, like the last 30 days.</li>
        <li><strong>Reel views</strong> is the total number of times our Reels were watched. <strong>Viewers</strong> is how many different people watched. <strong>Net follows</strong> is new followers minus unfollows. Swipe the cards sideways to see them all.</li>
        <li><strong>The graph</strong> shows views per day. A spike means a post took off, so check which one it was and why.</li>
        <li><strong>Reels list:</strong> sort by latest, most views, most likes or most comments. Under each Reel are its likes, comments, reposts and shares, with total views on the right.</li>
      </ul>
      <p>These are the numbers we log in the Media Calendar. Once a post has been up for 24 hours, open its Results and copy in the views, saves and shares for each platform.</p>
      <p class="tip"><strong>Éanna tip:</strong> every few weeks, sort by Most views and look at the top five. Whatever they have in common (a player, a trend, a time of day) is what we should do more of.</p>
    </div>
    <figure><button class="shot"><img src="learn/edits/edits-12-insights.jpg" width="900" height="2781" loading="lazy" alt="Insights screen showing the date range, reel views, viewers, net follows, a daily views graph and a list of Reels sorted by most views"></button></figure>
  </article>

  <article class="lesson" id="edits-check" data-title="Before you post">
    <div class="txt">
      <h2><span class="n">11</span>Before you post: quick check</h2>
      <p>Run through this every time. Ticks are saved on this device only and reset with the button.</p>
      <ul class="check" id="edits-checklist">

      <p>Heard a sound that would work for us? Tap the <strong>song name</strong> under the account name on the Reel, or the small audio square at the bottom right, to open its <strong>audio page</strong>.</p>

  <article class="lesson" id="ig-habits" data-title="Good habits">
    <div class="txt">
      <h2><span class="n">8</span>Good habits on the club account</h2>
      <ul>
        <li><strong>Check the account</strong> before every action, and switch back to your own when you're finished.</li>
        <li><strong>Only like, follow or comment as the club</strong> on things that represent Éanna well: other clubs, the league, sponsors, our players.</li>
        <li><strong>Reply to comments</strong> on our posts within a day where you can. It helps posts reach more people.</li>
        <li><strong>Save, don't screenshot.</strong> Saved posts keep the audio and can be turned into templates, and screenshots can't.</li>

  <article class="lesson wide" id="mbs-create" data-title="Scheduling: Create">

      <h2><span class="n">2</span>Scheduling a Reel, step 1: Create</h2>
      <p>Click <span class="ui">Create reel</span> (or <span class="ui">Create post</span> for a photo or graphic, which works the same way). Creating has three steps along the top: <strong>Create</strong>, <strong>Edit</strong> and <strong>Share</strong>.</p>

        <li><span class="ui">Add Video</span>: upload the finished video. It should already be edited in Edits or DaVinci.</li>
        <li>Write the <strong>caption</strong> the same way you would on Instagram. To use a different caption on each platform, turn on <strong>Customise post for Facebook and Instagram</strong>.</li>
        <li>Check the preview on the right, then click <span class="ui">Next</span>.</li>

    <div class="txt">
      <h2><span class="n">3</span>Step 2: Edit</h2>
      <p>Since the video is already edited, you'll usually just check it and click <span class="ui">Next</span>. The tabs are <strong>Audio</strong>, <strong>Crop</strong>, <strong>Text</strong> and <strong>Optimizations</strong>. The audio library is useful, though: it's licensed music that's safe for the club account. If you add music, use <strong>Original audio volume</strong> to turn the clip's own sound down. The timeline lets you trim the start and end, and the menu above the preview switches it between Facebook and Instagram.</p>

      <h2><span class="n">4</span>Step 3: Share or schedule</h2>
      <p>Under <strong>Scheduling options</strong>, pick <span class="ui">Schedule</span> and choose the date and time (use the time from the Media Calendar). <span class="ui">Save as draft</span> keeps it to finish later, and <span class="ui">Share now</span> posts straight away.</p>
      <ul>
        <li><strong>Share to:</strong> this also puts it on the Facebook story. Turn it off if you don't want that.</li>
        <li><strong>Closed captions:</strong> leave them on. Lots of people watch without sound.</li>
        <li><strong>Copyright check:</strong> let it finish before you post. If it flags music, swap the track.</li>

  <article class="lesson wide" id="mbs-content" data-title="Scheduled and drafts">

      <h2><span class="n">5</span>Checking scheduled posts and drafts</h2>
      <p>Go to <strong>Content</strong> in the left menu. The tabs along the top split everything up: <strong>Published</strong>, <strong>Scheduled</strong> and <strong>Drafts</strong>. Open Scheduled to see what's queued. The <strong>…</strong> button next to a post gives options like editing or deleting it, and the Planner in the left menu shows the same posts on a calendar.</p>
      <p>The small icons on each thumbnail show where it went: Instagram, Facebook, or both (marked <em>Crossposted</em>). <strong>Boost</strong> turns a post into a paid ad, so don't press it unless it's been agreed.</p>

      <p>This is the main reason to open Business Suite. <strong>Content</strong>, then <strong>Posts &amp; reels</strong>, lists every post from both platforms with its numbers. Scroll the table sideways to see them all:</p>

      <h2><span class="n">1</span>Starting a new project</h2>
      <p>Opening Resolve takes you to the <strong>Project Manager</strong>, a grid of every project on the laptop. Double-click one to open it, or click <strong>New Project</strong> to start fresh. Make one project per shoot or game, and name it clearly so anyone can find it later: <em>Eanna SL vs Tralee (H)</em>, <em>Eanna Media Day 2026</em>. Leave the Media Location as it is and click <span class="ui">Create</span>.</p>
      <p><strong>Export / Import</strong> at the bottom saves a project file (.drp). That's useful for backing up an edit or passing it to someone else, but it only contains the edit, not the footage, so the footage has to go with it separately.</p>

  <article class="lesson wide" id="dv-file" data-title="Open recent and saving">
    <div class="txt">
      <h2><span class="n">2</span>Opening recent projects and saving</h2>
      <p>The <strong>File</strong> menu has what you need most: <strong>Open Recent Project</strong> to jump back into something, <strong>Save Project</strong> (<kbd>Cmd</kbd>+<kbd>S</kbd>), <strong>Import &gt; Media</strong> (<kbd>Cmd</kbd>+<kbd>I</kbd>), <strong>Quick Export</strong>, the <strong>Project Manager</strong> (<kbd>Shift</kbd>+<kbd>0</kbd>) and <strong>Project Settings</strong> (<kbd>Shift</kbd>+<kbd>9</kbd>). Resolve autosaves, but press <kbd>Cmd</kbd>+<kbd>S</kbd> often anyway.</p>

  <article class="lesson wide" id="dv-edit" data-title="The Edit page">
    <div class="txt">
      <h2><span class="n">3</span>Finding your way around the Edit page</h2>
      <p>The page buttons are along the very bottom. Click the Edit page (or press <kbd>Shift</kbd>+<kbd>4</kbd>). It has four main areas: the <strong>Media Pool</strong> (your clips and bins) top left, the <strong>Viewer</strong> in the middle, the <strong>Inspector</strong> on the right (every setting for the clip you've selected), and the <strong>Timeline</strong> along the bottom, with video tracks on top and audio below. The edit tools sit just above the timeline.</p>

    <div class="txt">
      <h2><span class="n">4</span>Bins: keeping your clips organised</h2>
      <p>Bins are folders inside the project. Before importing, make a few: e.g. <strong>A-cam</strong>, <strong>Phone</strong>, <strong>Interviews</strong>, <strong>Music</strong>, <strong>Graphics</strong>. Click the <span class="ui">+</span> next to Bins, or right-click in the Media Pool and choose <strong>New Bin</strong>. Then open a bin and import into it with <kbd>Cmd</kbd>+<kbd>I</kbd>, or just drag files in from Finder.</p>
      <p>With a busy game it takes seconds to find the right clip instead of scrolling through hundreds.</p>

  <article class="lesson wide" id="dv-aspect" data-title="Aspect ratio">
    <div class="txt">
      <h2><span class="n">5</span>Aspect ratio: landscape or vertical</h2>
      <p>Set this <strong>before</strong> you start editing. Open <strong>Project Settings</strong> (<kbd>Shift</kbd>+<kbd>9</kbd>), then Master Settings:</p>
      <ul>
        <li><strong>Landscape</strong> (YouTube, the stream, big highlight videos): 1920 x 1080 HD.</li>
        <li><strong>Vertical</strong> (Reels, TikTok): keep 1920 x 1080 and tick <strong>Use vertical resolution</strong> to make it 1080 x 1920.</li>
        <li><strong>Frame rate:</strong> match your footage (our cameras shoot 50). It locks once footage is added, so set it first.</li>
      </ul>
      <p><strong>Need both versions?</strong> Right-click in the Media Pool, then Timelines, then Create New Timeline. Untick <em>Use Project Settings</em> and set that one timeline to vertical. That way one project can hold the landscape and the vertical edit.</p>
      <p><strong>Seeing the shape while you edit:</strong> the guides button above the viewer shows overlays. Pick <strong>9:16</strong> under Social Media to see what a vertical crop would keep, and <strong>Title</strong> under Safe Area Guides to keep text away from the edges.</p>
      <p class="tip"><strong>Éanna tip:</strong> edit landscape here, then reframe it for vertical in Edits (see the Edits section, lesson 5), so it's done once and posted from the phone.</p>
    </div>

  <article class="lesson wide" id="dv-cut" data-title="Playing and cutting">
    <div class="txt">
      <h2><span class="n">6</span>Playing, cutting and tidying the timeline</h2>
      <p><strong>Play with J, K and L</strong>, not the mouse: <kbd>L</kbd> plays forward (tap twice for double speed), <kbd>J</kbd> plays backwards, <kbd>K</kbd> stops. <kbd>Space</kbd> also plays and pauses. Use <kbd>←</kbd> and <kbd>→</kbd> to move one frame, and <kbd>↑</kbd> and <kbd>↓</kbd> to jump to the previous or next cut.</p>
      <p><strong>To cut:</strong> park the playhead and press <kbd>Cmd</kbd>+<kbd>B</kbd> to split the clip there. Then select the piece you don't want and press <kbd>Shift</kbd>+<kbd>Delete</kbd> (ripple delete), which removes it and closes the gap. A plain <kbd>Delete</kbd> leaves a gap behind.</p>
      <p><strong>Right-click a clip</strong> for more: <strong>Enable/Disable</strong> (<kbd>D</kbd>) hides a clip without deleting it, which is handy for trying an edit with and without a shot. <strong>Change Clip Speed</strong> and <strong>Retime Controls</strong> (<kbd>Cmd</kbd>+<kbd>R</kbd>) handle speed, and <strong>Clip Color</strong> colour-codes clips, e.g. green for the best takes.</p>
      <p class="tip"><strong>Éanna tip:</strong> before cutting a game, zoom the whole timeline into view with <kbd>Shift</kbd>+<kbd>Z</kbd>, then drop a marker (<kbd>M</kbd>) on every good play during the first watch-through. Then cut around the markers.</p>
    </div>
    <figure><button class="shot"><img src="learn/davinci/dv-08-playback.jpg" width="1400" height="1244" loading="lazy" alt="Playback menu with J K L, fast playback and loop highlighted"></button></figure>

  <article class="lesson wide" id="dv-key" data-title="Transform and keyframes">
    <div class="txt">
      <h2><span class="n">7</span>Transform and keyframing (zooms and moves)</h2>
      <p>Select a clip and open the <strong>Video</strong> tab of the Inspector. <strong>Transform</strong> has <strong>Zoom</strong> (size), <strong>Position</strong> (move it), <strong>Rotation</strong> and <strong>Flip</strong>. Changing these on their own sets them for the whole clip, e.g. zooming in to crop out the crowd.</p>
      <p><strong>Keyframes make it move over time</strong>, like a slow push-in on a player:</p>
      <ol>
        <li>Put the playhead where the move should start and click the <strong>diamond</strong> next to Zoom. It turns red: that's your first keyframe, at normal size.</li>
        <li>Move the playhead to where the move should end and change the Zoom (e.g. to 1.34). A second keyframe is added by itself.</li>
        <li>Play it back. Resolve smoothly zooms between the two. The small arrows by the diamond jump between keyframes, and a diamond icon appears on the clip in the timeline.</li>
      </ol>
      <p class="tip"><strong>Éanna tip:</strong> slow, subtle moves look professional. Keep zooms under about 1.3 on HD footage so it stays sharp.</p>
    </div>
    <figure><button class="shot"><img src="learn/davinci/dv-10-keyframe-start.jpg" width="1400" height="1244" loading="lazy" alt="First keyframe: playhead at the clip start, zoom at 1.000 and the red keyframe diamond"></button></figure>
    <figure><button class="shot"><img src="learn/davinci/dv-11-keyframe-end.jpg" width="1400" height="1205" loading="lazy" alt="Second keyframe: playhead later, zoom at 1.340 and the keyframe arrows"></button></figure>

  <article class="lesson wide" id="dv-trans" data-title="Transitions and titles">
    <div class="txt">
      <h2><span class="n">8</span>Transitions and titles</h2>
      <p>Open the <strong>Effects</strong> library (top left), then Toolbox, then <strong>Video Transitions</strong>. Drag a transition onto the cut between two clips, or select a cut and press <kbd>Cmd</kbd>+<kbd>T</kbd> to add the default <strong>Cross Dissolve</strong>. Drag its edges to make it longer or shorter. <strong>Fusion Transitions</strong> like Crash Zoom and Brightness Flash are flashier, so save them for a big moment. Most cuts should just be straight cuts.</p>
      <p><strong>Titles:</strong> in the same library under Titles, drag <strong>Text+</strong> onto a track above your video. Select it, then type in the Inspector and set the font, colour and size. Its Settings tab has the same Transform and keyframes as a clip, so titles can move too.</p>
      <p class="tip"><strong>Éanna tip:</strong> click the star on transitions and titles you use a lot. They'll appear under <strong>Favorites</strong> at the bottom of the library.</p>
    </div>
    <figure><button class="shot"><img src="learn/davinci/dv-12-transitions.jpg" width="1400" height="1205" loading="lazy" alt="Effects library with video transitions, cross dissolve and fusion transitions highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/davinci/dv-13-titles.jpg" width="1400" height="1244" loading="lazy" alt="Text+ title on the timeline with the text box and font settings in the Inspector highlighted"></button></figure>
  </article>

  <article class="lesson wide" id="dv-audio" data-title="Audio">
    <div class="txt">
      <h2><span class="n">9</span>Audio</h2>
      <p>Select an audio clip and open the <strong>Audio</strong> tab of the Inspector. <strong>Volume</strong> raises or lowers that clip. <strong>AI Dialogue Leveler</strong> evens out voices, which is great for interviews where people speak at different levels. The <strong>Equalizer</strong> can cut low gym rumble. Watch the <strong>Mixer</strong> on the right while it plays: voices should sit around -12 to -6, and nothing should hit the top.</p>
      <p class="tip"><strong>Éanna tip:</strong> when music plays under someone talking, drop the music right down so every word is clear. If in doubt, quieter music is better.</p>
    </div>
    <figure><button class="shot"><img src="learn/davinci/dv-14-audio.jpg" width="1400" height="1265" loading="lazy" alt="Audio inspector with volume, AI dialogue leveler, equalizer and the mixer highlighted"></button></figure>
  </article>

  <article class="lesson wide" id="dv-speed" data-title="Slow motion">
    <div class="txt">
      <h2><span class="n">10</span>Speed and slow motion</h2>
      <p>In the Inspector's Video tab, open <strong>Speed Change</strong>. <strong>Change Speed</strong> at 100 is normal and 50 is half speed. Tick <strong>Ripple Timeline</strong> so everything after the clip moves along instead of being covered. <strong>Direction</strong> can also reverse the clip or freeze a frame.</p>
      <p><strong>For smooth slow motion,</strong> film at a higher frame rate than the timeline (e.g. 100 fps on a 50 fps timeline, then set the speed to 50). If the footage wasn't filmed fast enough, scroll down to <strong>Retime and Scaling</strong> and set Retime Process to <strong>Optical Flow</strong>. It creates in-between frames. For Motion Estimation, use <em>Standard Faster</em> for speed or <em>AI Speed Warp</em> for the best result (it takes longer to play and export).</p>
    </div>
    <figure><button class="shot"><img src="learn/davinci/dv-15-speed.jpg" width="1400" height="1244" loading="lazy" alt="Speed change settings with direction, change speed and ripple timeline highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/davinci/dv-16-optical-flow.jpg" width="1400" height="1321" loading="lazy" alt="Retime and scaling with optical flow and the motion estimation list highlighted"></button></figure>
  </article>

  <article class="lesson wide" id="dv-stab" data-title="Stabilisation">
    <div class="txt">
      <h2><span class="n">11</span>Stabilisation</h2>
      <p>For shaky handheld or phone footage: select the clip, scroll to <strong>Stabilization</strong> in the Inspector and click <span class="ui">Stabilize</span>. It analyses the clip and smooths it out. <strong>Perspective</strong> mode works for most shots. Tick <strong>Camera Lock</strong> if it should look completely still, like it was on a tripod. Keep <strong>Zoom</strong> ticked so the moving edges are cropped out, and raise <strong>Smooth</strong> or <strong>Strength</strong> if it's still shaky.</p>
      <p class="tip"><strong>Éanna tip:</strong> stabilising crops in slightly, so check nothing important gets cut off at the edges. It can't fix very shaky footage, so a gimbal is always better.</p>
    </div>
    <figure><button class="shot"><img src="learn/davinci/dv-17-stabilise.jpg" width="1400" height="1342" loading="lazy" alt="Stabilization settings with stabilize, mode, camera lock, zoom and strength highlighted"></button></figure>
  </article>

  <article class="lesson wide" id="dv-color" data-title="A bit of colour">
    <div class="txt">
      <h2><span class="n">12</span>A bit of colour</h2>
      <p>The <strong>Color</strong> page (<kbd>Shift</kbd>+<kbd>6</kbd>) is huge, but you only need a few tools. Most clips just need a quick fix:</p>
      <ul>
        <li><strong>Temp:</strong> gym lights make everything orange. Pull Temp down a little to cool it.</li>
        <li><strong>Contrast</strong> and <strong>Saturation:</strong> a small nudge up makes footage pop. Keep skin tones natural.</li>
        <li><strong>Lift, Gamma, Gain:</strong> the three wheels control shadows, midtones and highlights. Drag the bar under a wheel to make that part brighter or darker.</li>
        <li><strong>Curves:</strong> a gentle S-shape (lower the bottom, raise the top) adds contrast.</li>
      </ul>
      <p><strong>Nodes</strong> (the boxes top right) are layers of grading. The project already has them set up, so you shouldn't need to add any. Just click the node you want to adjust; it gets a red outline.</p>
      <p><strong>Highlighting a player:</strong> the <strong>Window</strong> tool draws a soft circle around a player so you can brighten just them. The <strong>Tracker</strong> next to it makes the circle follow them. It's a nice touch on a player-of-the-game clip, but not needed day to day.</p>
      <p class="tip"><strong>Éanna tip:</strong> grade one clip, then copy it to the others from the same camera. Select the graded clip, select the others in the strip, and middle-click (or right-click, then Apply Grade).</p>
    </div>
    <figure><button class="shot"><img src="learn/davinci/dv-18-color-wheels.jpg" width="1400" height="1304" loading="lazy" alt="Color page with temp, contrast, colour wheels, sliders, nodes and the color page tab highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/davinci/dv-19-curves.jpg" width="1400" height="1244" loading="lazy" alt="Curves with an S-curve, the Y R G B buttons and the selected node highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/davinci/dv-20-window.jpg" width="1400" height="1244" loading="lazy" alt="Window tool with shapes, softness and the tracker highlighted"></button></figure>
  </article>

  <article class="lesson wide" id="dv-export" data-title="Exporting and AirDrop">
    <div class="txt">
      <h2><span class="n">13</span>Exporting, and getting it to Edits</h2>
      <p>Go to <strong>File</strong>, then <strong>Quick Export</strong>. Pick <strong>H.264 Master</strong> (the standard choice; the TikTok and YouTube presets also work), type a proper <strong>filename</strong> (e.g. <em>Eanna-vs-Tralee-highlights</em>), check the resolution and frame rate match your project, then click <span class="ui">Export</span> and choose where to save it. For more control over quality, use the <strong>Deliver</strong> page (<kbd>Shift</kbd>+<kbd>8</kbd>) instead.</p>
      <p><strong>AirDrop to your phone:</strong> find the exported file in Finder, right-click it, choose <strong>Share</strong>, then <strong>AirDrop</strong>, and pick your iPhone. Accept it on the phone and it saves to Photos. Open it in Edits to reframe it for vertical, add text in the saved Éanna style, and post from there.</p>
      <p class="tip"><strong>Éanna tip:</strong> if you'll reframe it to vertical in Edits, export at the highest resolution you filmed in, so there's detail left to zoom into. Also back the export up to the club Google Drive.</p>
    </div>
    <figure><button class="shot"><img src="learn/davinci/dv-21-quick-export.jpg" width="1400" height="1282" loading="lazy" alt="Quick Export with presets, filename, settings and the export button highlighted"></button></figure>
  </article>

  <article class="lesson" id="dv-keys" data-title="Shortcut cheat sheet">
    <div class="txt">
      <h2><span class="n">14</span>Shortcut cheat sheet</h2>

<template id="t-lightroom">
  <section class="intro">
    <div>
      <div class="kicker">Section 5 · Photo editing</div>
      <h1 class="title">Lightroom</h1>
      <p class="lead">Lightroom is where every game's photos get picked, edited and exported. A good edit isn't about filters: it's cropping in on the action, making the player stand out from a busy gym, cleaning up small distractions and fixing the grain from indoor lighting. Then copy that edit across the whole game in one go.</p>
      <p class="lead">Edit in this order: <strong>crop, then light and colour, then masks, then remove, and Denoise last</strong>. Lesson 3 explains why. Tap any screenshot to see it full size.</p>
    </div>
    <aside class="facts">
      <h3>At a glance</h3>
      <dl>
        <dt>Device</dt><dd>Lightroom on the laptop (this guide) or phone</dd>
        <dt>Account</dt><dd>Adobe plan; AI tools need the paid version</dd>
        <dt>Use it for</dt><dd>Game photos, media day, player portraits</dd>
        <dt>Export as</dt><dd>JPG Small for socials, Large for the archive</dd>
      </dl>
    </aside>
  </section>

  <ol class="toc" id="toc-lightroom"></ol>

  <article class="lesson wide" id="lr-around" data-title="Finding your way around">
    <div class="txt">
      <h2><span class="n">1</span>Finding your way around and viewing photos</h2>
      <p>The left panel is your library: <strong>All Photos</strong>, <strong>Recently Added</strong> (the latest import sits at the top, e.g. "1 hour ago"), <strong>By Date</strong>, <strong>People</strong> and your <strong>Albums</strong> at the bottom. The editing tools run down the right edge.</p>
      <p><strong>Viewing:</strong> the buttons bottom left switch between the <strong>grid views</strong>, for scanning a whole game at once, and <strong>single photo view</strong> (<kbd>D</kbd>), for checking sharpness and expressions. Hold <kbd>\</kbd> (backslash) at any time to flick to the original and compare your edit.</p>
      <p><strong>Picking the keepers:</strong> a game can be 400 photos and we post maybe 20. Go through in single view with the arrow keys and press <kbd>P</kbd> to flag a keeper or <kbd>X</kbd> to reject. Number keys <kbd>1</kbd> to <kbd>5</kbd> add stars (e.g. 5 stars for the best of the night). Then filter to just your picks and only edit those.</p>
    </div>
    <figure><button class="shot"><img src="learn/lightroom/lr-01-library.jpg" width="1400" height="1441" loading="lazy" alt="Lightroom library with add photos, the library panel, view buttons, ratings, copy edit settings, editing tools and before/after highlighted"></button></figure>
  </article>

  <article class="lesson wide" id="lr-add" data-title="Adding photos">
    <div class="txt">
      <h2><span class="n">2</span>Adding photos</h2>
      <ol>
        <li>Put the camera card in the laptop and click <strong>Add Photos</strong> (top left).</li>
        <li>Pick the card from Locations (it shows by its name, e.g. KODAK), or the folder the photos are in, then click <span class="ui">Review for Import</span>.</li>
        <li>Untick anything obviously unusable, set <strong>Add to Album</strong> to a new album for the game (e.g. <em>Eanna vs Tralee 12 Oct</em>), then click <span class="ui">Add</span>.</li>
      </ol>
      <p class="tip"><strong>Éanna tip:</strong> back the original files up to the club Google Drive too, before wiping the card. Lightroom is not a backup.</p>
    </div>
    <figure><button class="shot"><img src="learn/lightroom/lr-02-add-photos.jpg" width="1400" height="1205" loading="lazy" alt="Add photos file picker with the camera card, a folder and Review for Import highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/lightroom/lr-03-review-import.jpg" width="1400" height="1244" loading="lazy" alt="Import review screen with the tick boxes, Add to Album, Select All and the add button highlighted"></button></figure>
  </article>

  <article class="lesson wide" id="lr-order" data-title="Editing order">
    <div class="txt">
      <h2><span class="n">3</span>The editing order, and why</h2>
      <ol>
        <li><strong>Crop first,</strong> because everything else depends on what's in the frame. No point brightening a corner you're about to cut off.</li>
        <li><strong>Light and colour</strong> (Edit panel): fix the whole photo first. Press <span class="ui">Auto</span> as a starting point, then pull Temp down if the gym lights look orange, and adjust Exposure and Contrast.</li>
        <li><strong>Masks:</strong> now make targeted changes, like brightening the player or darkening the background. These build on the overall edit.</li>
        <li><strong>Remove:</strong> clean up small distractions once you can see the finished photo and what actually catches the eye.</li>
        <li><strong>Denoise last.</strong> It processes the photo and creates a new file behind the scenes, so it's slow. If you do it early, every change after it is slower, and brightening dark areas later brings back noise it didn't account for. Do it once, at the end.</li>
      </ol>
      <p>The example below went through all five steps: a tighter crop, the background darkened, the player brightened with masks, a warm glow added with a gradient, and a distracting light removed.</p>
    </div>
    <figure><button class="shot"><img src="learn/lightroom/lr-00-before-after.jpg" width="1400" height="1133" loading="lazy" alt="Before and after comparison of an Éanna dunk photo"></button></figure>
  </article>

  <article class="lesson wide" id="lr-crop" data-title="Cropping">
    <div class="txt">
      <h2><span class="n">4</span>Cropping</h2>
      <p>Open the Crop tool (<kbd>C</kbd>). <strong>Why crop?</strong> Game photos are shot wide to catch the play, but the story is the player. Cropping in makes them bigger, cuts out empty floor and crowd, and fits the shape of the platform.</p>
      <ul>
        <li><strong>Aspect:</strong> choose <strong>4 x 5</strong> for Instagram posts (it takes up the most screen in the feed), 9 x 16 for stories, or keep the original. Lock it so the shape stays as you drag.</li>
        <li><strong>Drag the corners in</strong> and move the photo behind the frame. The <strong>Thirds</strong> overlay helps: put the player or ball on a line or where two lines cross.</li>
        <li><strong>Straighten:</strong> click Auto if the hoop or court lines are tilted.</li>
      </ul>
      <p class="tip"><strong>Éanna tip:</strong> always leave space in the direction the player is moving or looking, and never crop through hands, feet or the ball.</p>
    </div>
    <figure><button class="shot"><img src="learn/lightroom/lr-04-crop.jpg" width="1400" height="1265" loading="lazy" alt="Crop panel with the crop tool, aspect, lock, straighten, overlay and rotate options highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/lightroom/lr-05-crop-after.jpg" width="1400" height="1145" loading="lazy" alt="A tighter crop around the dunk with the aspect ratio highlighted"></button></figure>
  </article>

  <article class="lesson wide" id="lr-mask" data-title="Masking">
    <div class="txt">
      <h2><span class="n">5</span>Masking: editing just one part of the photo</h2>
      <p>A mask lets you change part of the photo without touching the rest. <strong>Why?</strong> Gyms are busy: crowds, walls, banners. Masks let you lift the player and push everything else back, so the eye goes straight to the action.</p>
      <p>Open Masking (<kbd>M</kbd>) and click <strong>Create New Mask</strong>. The red overlay shows what's selected, and any slider you move only affects that area.</p>
      <ul>
        <li><strong>Subject:</strong> one click and Lightroom picks out the people. Often it grabs both players, so use <span class="ui">Subtract</span>, then pick the person to take out (e.g. the other team's player), leaving just ours. Then raise Exposure a touch so they pop.</li>
        <li><strong>Background:</strong> selects everything except the subject. Pull Exposure down slightly (around -0.3) so the crowd and walls sit back.</li>
        <li><strong>People:</strong> select one specific player, or all of them, or even just their face or clothing.</li>
        <li><strong>Sky</strong> and <strong>Landscape:</strong> mostly for outdoor shots.</li>
        <li><strong>Brush</strong> (<kbd>B</kbd>): paint the mask by hand for anything the AI misses.</li>
        <li><strong>Color Range</strong> and <strong>Luminance Range:</strong> select everything of one colour (e.g. the green bibs) or brightness.</li>
      </ul>
      <p><strong>Invert</strong> (top of the mask settings) flips any mask, so a Subject mask becomes "everything except the player".</p>
    </div>
    <figure><button class="shot"><img src="learn/lightroom/lr-06-mask-subject.jpg" width="1400" height="1304" loading="lazy" alt="Subject mask selecting both players, with create new mask, add/subtract, invert and light sliders highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/lightroom/lr-07-mask-subtract.jpg" width="1400" height="1205" loading="lazy" alt="Subtracting the opposing player from the mask"></button></figure>
    <figure><button class="shot"><img src="learn/lightroom/lr-08-mask-types.jpg" width="1400" height="1304" loading="lazy" alt="Mask types menu with subject, sky, background, people, brush, gradients and ranges highlighted"></button></figure>
  </article>

  <article class="lesson wide" id="lr-grad" data-title="Gradients">
    <div class="txt">
      <h2><span class="n">6</span>Linear and radial gradients</h2>
      <p><strong>Linear gradient</strong> (<kbd>L</kbd>): drag across the photo. The effect is full strength past the first line and fades out to nothing by the last line. <strong>Why?</strong> To add light or mood from one side. Here, Temp +100 adds a warm glow from the top corner, like light spilling into the gym. It's also good for darkening a bright ceiling or a distracting floor.</p>
      <p><strong>Radial gradient</strong> (<kbd>R</kbd>): draw an oval. The inner ring is full strength and it fades out to the outer ring (set the softness with Feather). <strong>Why?</strong> To put a soft spotlight on the player. Click <strong>Invert</strong> and it selects everything <em>outside</em> the oval instead, so you can darken the edges into a vignette that pulls the eye in.</p>
      <p class="tip"><strong>Éanna tip:</strong> subtle is better. If someone can tell where the gradient is, it's too strong. Turn off Show Overlay to judge the real result.</p>
    </div>
    <figure><button class="shot"><img src="learn/lightroom/lr-09-linear.jpg" width="1400" height="1184" loading="lazy" alt="Linear gradient lines dragged across the photo"></button></figure>
    <figure><button class="shot"><img src="learn/lightroom/lr-10-linear-warm.jpg" width="1400" height="1145" loading="lazy" alt="Linear gradient with Temp at +100 creating a warm glow"></button></figure>
    <figure><button class="shot"><img src="learn/lightroom/lr-11-radial.jpg" width="1400" height="1145" loading="lazy" alt="Radial gradient oval around the player with feather highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/lightroom/lr-12-radial-invert.jpg" width="1400" height="1145" loading="lazy" alt="Inverted radial gradient selecting everything outside the player"></button></figure>
  </article>

  <article class="lesson wide" id="lr-remove" data-title="Generative remove">
    <div class="txt">
      <h2><span class="n">7</span>Generative Remove: small things only</h2>
      <p>The Remove tool cleans up small distractions: an exit sign, a light, a water bottle on the court, a stray bit of tape. With <strong>Use Generative AI</strong> ticked, it fills the gap with something that matches the surroundings.</p>
      <ol>
        <li>Open Remove and set the brush <strong>Size</strong> just bigger than the object.</li>
        <li>Paint over it (it goes red), then click <span class="ui">Remove</span>.</li>
        <li>Use <strong>Variations</strong> to flick through the three options and keep the most natural one.</li>
      </ol>
      <p><strong>Only use it for small things in the background.</strong> Never remove or change players, referees, the scoreboard, sponsor logos or anything that changes what actually happened. For bigger areas the AI often makes strange shapes, and this is club and match media, so it has to stay honest.</p>
    </div>
    <figure><button class="shot"><img src="learn/lightroom/lr-13-remove.jpg" width="1400" height="1244" loading="lazy" alt="Remove tool panel with the remove brush, size and use generative AI highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/lightroom/lr-14-remove-brush.jpg" width="1400" height="1145" loading="lazy" alt="Painting over a wall light, with the Remove button highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/lightroom/lr-15-remove-result.jpg" width="1400" height="1205" loading="lazy" alt="The wall light removed, with the variations and fill highlighted"></button></figure>
  </article>

  <article class="lesson wide" id="lr-denoise" data-title="Denoise (last)">
    <div class="txt">
      <h2><span class="n">8</span>Denoise: always the last step</h2>
      <p>Gyms are dark, so cameras push the ISO up and photos come out <strong>grainy</strong>: speckles you can see when you zoom in, especially on dark jerseys and in shadows. It looks worse on big screens and when you crop in.</p>
      <ol>
        <li>Finish every other edit first.</li>
        <li>In the Edit panel, open <strong>Detail</strong> and tick <strong>Denoise</strong>.</li>
        <li>Zoom to 100% on the player and set the <strong>Amount</strong>. Around 50 to 70 is usually enough. Too high and skin and jerseys start to look plastic.</li>
      </ol>
      <p><strong>Why last?</strong> Denoise is heavy AI processing that makes a new version of the photo. Every edit after it is slower, and brightening shadows afterwards (with masks, say) reveals grain that wasn't cleaned. It's also slow to run, so run it once, at the end, or across all your picks at once.</p>
      <p>Sharpening at around 40 is fine to leave as it is.</p>
    </div>
    <figure><button class="shot"><img src="learn/lightroom/lr-16-detail.jpg" width="1400" height="1167" loading="lazy" alt="The Detail panel with sharpening and denoise highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/lightroom/lr-17b-denoise-compare.jpg" width="1400" height="822" loading="lazy" alt="Side-by-side comparison of a grainy jersey with denoise off and a clean one with denoise on"></button></figure>
    <figure><button class="shot"><img src="learn/lightroom/lr-17-denoise-before.jpg" width="1400" height="1145" loading="lazy" alt="Zoomed photo before denoise showing grain"></button></figure>
    <figure><button class="shot"><img src="learn/lightroom/lr-18-denoise-after.jpg" width="1400" height="1145" loading="lazy" alt="The same zoomed photo after denoise at amount 100"></button></figure>
  </article>

  <article class="lesson wide" id="lr-batch" data-title="Copy and paste edits">
    <div class="txt">
      <h2><span class="n">9</span>Copy and paste edits onto a whole batch</h2>
      <p>Photos from the same game, same gym and same camera settings all need roughly the same edit. Edit one properly, then copy it onto the rest:</p>
      <ol>
        <li>Select your finished photo and click <span class="ui">Copy Edit Settings</span> at the bottom (<kbd>Cmd</kbd>+<kbd>C</kbd>). Choose what to copy; untick Crop and Masks, since those are different for every photo.</li>
        <li>Go to grid view and select the photos to match (<kbd>Cmd</kbd>+click to pick individual ones, <kbd>Shift</kbd>+click for a run).</li>
        <li>Click <span class="ui">Paste Edit Settings</span> (<kbd>Cmd</kbd>+<kbd>V</kbd>).</li>
      </ol>
      <p>Then quickly go through them one by one: adjust exposure where needed, crop each one and add masks, then Denoise all your picks together at the end.</p>
      <p class="tip"><strong>Éanna tip:</strong> once you have a look you're happy with, save it as a <strong>Preset</strong> (in the Presets panel), e.g. <em>Éanna Home Gym</em>, so every game starts from the same club look.</p>
    </div>
    <figure><button class="shot"><img src="learn/lightroom/lr-19-paste.jpg" width="1400" height="1205" loading="lazy" alt="Grid view with the edited photo, the selection and Paste Edit Settings highlighted"></button></figure>
  </article>

  <article class="lesson wide" id="lr-export" data-title="Exporting">
    <div class="txt">
      <h2><span class="n">10</span>Exporting</h2>
      <p>Select the finished photos and click the <strong>export button</strong> (top right) or press <kbd>Cmd</kbd>+<kbd>Shift</kbd>+<kbd>E</kbd>.</p>
      <ul>
        <li><strong>JPG (Small)</strong> (2048 pixels) is right for Instagram, Facebook and WhatsApp. It's sharp on phones and quick to upload.</li>
        <li><strong>JPG (Large)</strong> (full size) is for printing, sponsors or the club's archive.</li>
        <li><strong>Custom Settings</strong> lets you choose the exact size, quality and save location.</li>
        <li><strong>Previous Settings</strong> repeats your last export in one click.</li>
      </ul>
      <p class="tip"><strong>Éanna tip:</strong> export into a folder named after the game, then upload it to the club Google Drive and AirDrop the best few to your phone for posting.</p>
    </div>
    <figure><button class="shot"><img src="learn/lightroom/lr-20-export.jpg" width="1400" height="1304" loading="lazy" alt="Export menu with custom settings, JPG small, JPG large and previous settings highlighted"></button></figure>
  </article>
</template>

      <h1 class="title">Canva</h1>
      <p class="lead">Canva is where every Éanna graphic gets made: final scores, stat cards, match previews, player features. The goal is that every post looks like it came from the same club, so we start from our own templates in the EANNA folder, use the Brand Kit colours and reuse the same assets wherever we can.</p>

  <ol class="toc" id="toc-canva"></ol>

  <article class="lesson wide" id="cv-home" data-title="Home and projects">
    <div class="txt">
      <h2><span class="n">1</span>The home screen and finding projects</h2>
      <p>The home screen shows <strong>Recent designs</strong> down the left and <strong>Continue designing</strong> in the middle, so most of the time what you need is right there. The search bar finds anything: your designs, templates or photos.</p>
      <p><strong>Projects</strong> (left bar) holds everything: <strong>Recents</strong>, <strong>Your projects</strong>, <strong>Shared with you</strong> and all the <strong>Folders</strong>. Use the filters (Type, Category, Owner, Date modified) when you're looking for something older.</p>

  <article class="lesson wide" id="cv-eanna" data-title="The EANNA folder">
    <div class="txt">
      <h2><span class="n">2</span>The EANNA folder: our templates</h2>
      <p>Everything we post is built from the templates in the <strong>EANNA</strong> folder: player stat graphics, final scores, match previews ("Keys to Victory"), standings, trading cards and game day graphics. <strong>Always start here</strong> rather than from a blank page, so the club look stays consistent.</p>
      <p>Hover over the folder and click the <strong>star</strong>. It then appears under <strong>Your starred</strong> in the sidebar, one click away from anywhere in Canva.</p>
      <p class="tip"><strong>Éanna tip:</strong> never edit the master template directly. Open it, then <strong>File &gt; Make a copy</strong> (or duplicate the page) and work on the copy, so the original stays clean for next week.</p>
    </div>

  <article class="lesson wide" id="cv-templates" data-title="Finding and starring templates">
    <div class="txt">
      <h2><span class="n">3</span>Finding templates and starring ideas</h2>
      <p>Go to <strong>Templates</strong> and search for what you need: "basketball stats", "player of the game", "match day", "head to head". Filter by category or style. A <strong>crown</strong> means it's a Pro template.</p>
      <p><strong>When you're bored, browse and star.</strong> Scrolling templates for 10 minutes and starring anything with a good layout, font or idea builds up a bank to pull from on a busy game day. Click the <strong>…</strong> on a template and choose <strong>Star</strong>. Everything you star lives in <strong>Templates &gt; Starred content</strong>.</p>
      <p>Templates are usually made for other sports or teams. We use them for the <em>layout</em>, then swap in our photos, the Brand Kit colours and Éanna fonts so it still looks like us.</p>
    </div>
    <figure><button class="shot"><img src="learn/canva/cv-05-search-templates.jpg" width="1400" height="1205" loading="lazy" alt="Template search for basketball stats with filters, crown and starred content highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/canva/cv-06-star-template.jpg" width="1400" height="1145" loading="lazy" alt="Template menu with Star and Customize highlighted"></button></figure>
