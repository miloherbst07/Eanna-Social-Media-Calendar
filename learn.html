      </dl>
    </aside>
  </section>

  <ol class="toc" id="toc-swish"></ol>

  <article class="lesson two" id="sw-login" data-title="Getting in">
    <div class="txt">
      <h2><span class="n">1</span>Getting into Swish</h2>
      <ol>
        <li>Download <strong>Swish</strong> from the App Store or Google Play. It's the icon with the orange and pink zig-zag.</li>
        <li><strong>A club login will be provided to you</strong> by the Content Manager when you join the media team. You'll get the email and password directly; ask for them if you haven't got them.</li>
        <li>Open the app and sign in with those details. The club account is the <strong>GOLD</strong> version, which shows the full box scores, Keys and AI recaps.</li>
      </ol>
      <p class="tip"><strong>Éanna tip:</strong> the login belongs to the club. Don't share it, don't change the password, and don't post screenshots that show the account details. If you think it's been shared, tell the Content Manager.</p>
    </div>
    <figure><button class="shot"><img src="learn/swish/sw-01-app.jpg" width="900" height="2198" loading="lazy" alt="iPhone Sports folder with the Swish app highlighted"></button></figure>
  </article>

  <article class="lesson two" id="sw-comps" data-title="Finding our competitions">
    <div class="txt">
      <h2><span class="n">2</span>Finding our competitions</h2>
      <p>The home screen has three tabs: <strong>PLAYERS</strong>, <strong>COMPETITIONS</strong> and <strong>TEAMS</strong>. Competitions is the one you'll use most.</p>
      <ol>
        <li>Tap <strong>COMPETITIONS</strong>. Check the <strong>Season</strong> at the top is the current one (2026/2027). Tap the arrow to look back at older seasons.</li>
        <li>Under <strong>Basketball Ireland</strong>, scroll to the one you need:
          <ul>
            <li><strong>Domino's Men's Super League</strong>: our senior men's team.</li>
            <li><strong>Domino's Men's Division One</strong>.</li>
            <li><strong>BIDL</strong> competitions (one for each age group and gender).</li>
            <li><strong>U20 National Cup</strong> and <strong>U20 National League</strong> (further down the list).</li>
          </ul>
        </li>
        <li>Open each one and tap the <strong>star</strong> (top right). Starred competitions appear under the star button in the bottom bar, so next time it's one tap.</li>
        <li>Or use <strong>Search</strong> (magnifying glass) and type <em>Éanna</em> to jump straight to one of our teams or players.</li>
      </ol>
      <p class="tip"><strong>Éanna tip:</strong> star all of our competitions on your first day. On match night you want to get to the stats in seconds, not scroll through every league in the country.</p>
    </div>
    <figure><button class="shot"><img src="learn/swish/sw-02-competitions.jpg" width="900" height="2752" loading="lazy" alt="Swish competitions list with season, Super League, Division One, BIDL, favourites and search highlighted"></button></figure>
  </article>

  <article class="lesson two" id="sw-rounds" data-title="Rounds, standings and games">
    <div class="txt">
      <h2><span class="n">3</span>Rounds, standings and games</h2>
      <p>Inside a competition you'll see three tabs along the top:</p>
      <ul>
        <li><strong>ROUNDS</strong>: every game, round by round. Tap a round chip (ROUND 1, ROUND 2...) to see that week's games.</li>
        <li><strong>STANDINGS</strong>: the league table (wins, losses, points). Useful for previews: "2nd in the table, travelling to 1st".</li>
        <li><strong>STATISTICS</strong>: season leaders across the whole league: top scorer, most rebounds, most assists. Great for "Éanna's X leads the league in..." posts.</li>
      </ul>
      <p>Each <strong>game card</strong> shows the venue, date and time, both teams, the final score and the points scored in each quarter (P1 to P4). <strong>Finished</strong> means the stats are final. During a game it shows as <strong>LIVE</strong> and updates as the scorer enters stats.</p>
      <p>Tap the game card to open the full game.</p>
      <p class="tip"><strong>Éanna tip:</strong> the quarter scores tell the story fast. Here Éanna lost the 2nd quarter 23-27 but won the 4th 20-15. "Won the fourth quarter by 5 to take it 77-75" is a ready-made caption line.</p>
    </div>
    <figure><button class="shot"><img src="learn/swish/sw-03-rounds.jpg" width="900" height="2540" loading="lazy" alt="Super League rounds with the star, tabs, round chips, a game card and the Finished label highlighted"></button></figure>
  </article>

  <article class="lesson two" id="sw-box" data-title="Reading the box score">
    <div class="txt">
      <h2><span class="n">4</span>Reading the box score</h2>
      <p>Inside a game, the tabs are <strong>KEYS</strong>, <strong>BOX SCORE</strong> and <strong>PLAY BY PLAY</strong> (plus LINEUPS, AI RECAP and INFORMATION if you swipe). The <strong>box score</strong> is a table: one row per player, one column per stat.</p>
      <ul>
        <li><strong>ALL</strong> shows the whole game. <strong>P1 to P4</strong> show a single quarter, handy for "12 points in the 4th quarter alone".</li>
        <li><strong>Swipe the stat columns left</strong> to see more. The player names stay put.</li>
        <li>A <strong>green dot</strong> next to a player means they started the game.</li>
        <li>The number in the blue square is their <strong>jersey number</strong>.</li>
      </ul>
      <h3 class="sub">What the columns mean</h3>
      <p>You won't always see every column. It depends on the competition and what the scorer recorded.</p>
      <table class="stable">
        <tr><th>Column</th><th>Means</th></tr>
        <tr><td>M</td><td>Minutes played (34:47 = 34 minutes 47 seconds)</td></tr>
        <tr><td>PTS</td><td>Points</td></tr>
        <tr><td>FT</td><td>Free throws made/attempted (3/4 = made 3 of 4)</td></tr>
        <tr><td>%FT</td><td>Free throw percentage</td></tr>
        <tr><td>2PT / 3PT</td><td>2-pointers and 3-pointers made/attempted</td></tr>
        <tr><td>FG</td><td>Field goals: all 2s and 3s together</td></tr>
        <tr><td>OR / DR</td><td>Offensive / defensive rebounds</td></tr>
        <tr><td>REB</td><td>Total rebounds (OR + DR)</td></tr>
        <tr><td>AST</td><td>Assists: passes that lead straight to a basket</td></tr>
        <tr><td>TOV</td><td>Turnovers: losing the ball to the other team</td></tr>
        <tr><td>STL</td><td>Steals</td></tr>
        <tr><td>BLK</td><td>Blocks</td></tr>
        <tr><td>PF</td><td>Personal fouls (5 and the player is out)</td></tr>
        <tr><td>+/-</td><td>How many points the team won or lost by while that player was on court</td></tr>
        <tr><td>EFF / PIR</td><td>Efficiency: one number that adds up the good stats and takes away the bad</td></tr>
      </table>
      <p class="tip"><strong>Éanna tip:</strong> a <strong>double-double</strong> is 10 or more in two stats (e.g. 14 points and 11 rebounds). Always worth a graphic. Points + rebounds + assists all in double figures is a <strong>triple-double</strong>, and that's a post on its own.</p>
    </div>
    <figure><button class="shot"><img src="learn/swish/sw-04-boxscore-pts.jpg" width="900" height="2415" loading="lazy" alt="Box score with game tabs, quarter filter, stat columns, top scorer and starter dot highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/swish/sw-05-boxscore-reb.jpg" width="900" height="2304" loading="lazy" alt="Box score scrolled to rebounds, assists and turnovers, with the assist leader highlighted"></button></figure>
  </article>

  <article class="lesson two" id="sw-keys" data-title="Keys: comparing the teams">
    <div class="txt">
      <h2><span class="n">5</span>Keys: comparing the teams</h2>
      <p>The <strong>KEYS</strong> tab is the quickest overview of the game. It has three views:</p>
      <ul>
        <li><strong>COMPARATIVE</strong>: both teams' totals side by side (rebounds, assists, fouls, steals, turnovers, blocks) and shooting percentages. The first team on the game card is blue, the second is orange.</li>
        <li><strong>GAME FLOW</strong>: how the lead changed over the game, including lead changes, ties and the biggest lead.</li>
        <li><strong>LEADERS</strong>: the top player on each team for points, rebounds, assists and more. This is often all you need for a stat graphic.</li>
      </ul>
      <p>Like the box score, you can filter by quarter with <strong>P1 to P4</strong>.</p>
      <p><strong>Reading the shooting circles:</strong> 67% with 12/18 under it means 12 made out of 18 tried. The fuller the circle, the better.</p>
      <p class="tip"><strong>Éanna tip:</strong> look for the stat that explains the result. Here Éanna were out-rebounded 40-50 but forced 22 turnovers and only made 14. "Forced 22 turnovers" is the story.</p>
    </div>
    <figure><button class="shot"><img src="learn/swish/sw-06-keys.jpg" width="900" height="2410" loading="lazy" alt="Keys tab with comparative, game flow and leaders, team totals and shooting percentages highlighted"></button></figure>
  </article>

  <article class="lesson two" id="sw-recap" data-title="AI recap">
    <div class="txt">
      <h2><span class="n">6</span>The AI recap</h2>
      <p>Swish writes a short <strong>match report</strong> for each game, found under <strong>AI RECAP</strong> (swipe the game tabs). It's built from the stats, so it's ready a few minutes after the game.</p>
      <ul>
        <li><strong>Use it for ideas:</strong> the headline and facts like lead changes, the biggest lead and runs are a quick starting point for a caption or website report.</li>
        <li><strong>Don't copy and paste it.</strong> Rewrite it in our voice and add what the stats can't know: the atmosphere, a player's milestone, the crowd.</li>
        <li><strong>Check every number</strong> against the box score. AI recaps can get details wrong, and the box score is the official record.</li>
        <li>Spellings of player names come from the scoresheet. Check them against our own roster before posting.</li>
      </ul>
    </div>
    <figure><button class="shot"><img src="learn/swish/sw-07-recap.jpg" width="900" height="2410" loading="lazy" alt="AI recap with the tab, headline and key facts highlighted"></button></figure>
  </article>

  <article class="lesson" id="sw-graphics" data-title="Stats for graphics">
    <div class="txt">
      <h2><span class="n">7</span>Using stats for graphics</h2>
      <p>Stat graphics are made in <strong>Canva</strong> from our templates in the EANNA folder (see the <strong>Canva</strong> tab). Swish gives you the numbers.</p>
      <table class="stable">
        <tr><th>Graphic</th><th>Where to find the stats</th></tr>
        <tr><td>Final score</td><td>Game card: score and the four quarter scores</td></tr>
        <tr><td>Player of the game</td><td>Box score: points, rebounds, assists, minutes</td></tr>
        <tr><td>Team stats</td><td>Keys, Comparative: rebounds, assists, turnovers, shooting %</td></tr>
        <tr><td>Top performers</td><td>Keys, Leaders: top scorer, rebounder, assister</td></tr>
        <tr><td>League table</td><td>Standings tab of the competition</td></tr>
        <tr><td>Season leaders</td><td>Statistics tab of the competition</td></tr>
      </table>
      <h3 class="sub">Picking the right stats</h3>
      <ul>
        <li><strong>Three to four stats per player</strong> is plenty. Points first, then whatever they did best.</li>
        <li><strong>Lead with the highlight, not the full line.</strong> 5 assists with 0 turnovers says more than listing everything.</li>
        <li><strong>Leave out stats that make a player look bad</strong> (e.g. 1/9 shooting). We celebrate our players.</li>
        <li><strong>Percentages need context.</strong> "100% from the line (3/3)" is better than "100%" on its own.</li>
      </ul>
      <p class="tip"><strong>Éanna tip:</strong> before you export, read every number on the graphic against Swish one more time, out loud if you have to. A wrong stat gets screenshotted.</p>
    </div>
  </article>

  <article class="lesson" id="sw-interviews" data-title="Stats for interviews">
    <div class="txt">
      <h2><span class="n">8</span>Using stats for interviews</h2>
      <p>Check Swish <strong>before</strong> the post-game interview, while the player is cooling down. Two minutes in the box score gives you sharper questions (see the question bank in the <strong>Interviews</strong> tab).</p>
      <ul>
        <li><strong>Find their standout stat:</strong> "You had 20 points tonight, including some big ones late. What was working for you?"</li>
        <li><strong>Find the team stat:</strong> "You forced 22 turnovers. Was that the plan coming in?"</li>
        <li><strong>Use the quarter scores:</strong> "You won the fourth quarter 20-15. What changed?"</li>
        <li><strong>Use the standings:</strong> "That's four wins in a row and you're second in the table. What do you need to bring next week?"</li>
      </ul>
      <p class="tip"><strong>Éanna tip:</strong> remember the format is 3 questions in under 90 seconds. Use one stat at most per question, and say it as a fact, not a quiz. The player should be talking, not doing maths.</p>
    </div>
  </article>

  <article class="lesson" id="sw-clips" data-title="Stats on highlight clips">
    <div class="txt">
      <h2><span class="n">9</span>Mixing stats with highlight clips</h2>
      <p>A highlight clip with a stat on it tells the viewer why it matters. Add the text in <strong>Edits</strong> (see the <strong>Edits</strong> tab, Text lesson) or in DaVinci for longer edits.</p>
      <ul>
        <li><strong>Player highlights:</strong> open on the name and their stat line, e.g. <em>Morgan Taylor · 20 PTS · 4 REB</em>, then the clips.</li>
        <li><strong>Game recap:</strong> end on the final score and one team stat, e.g. <em>77-75 · 22 forced turnovers</em>.</li>
        <li><strong>Big moment:</strong> add context on the clip, e.g. <em>Lead change #7</em> or <em>Game-winner with 0:08 left</em> (check the Play by Play tab for times).</li>
        <li><strong>Keep the text short</strong>: one line, big, on screen for at least 2 seconds, and inside the safe zone so Instagram and TikTok buttons don't cover it.</li>
      </ul>
      <p class="tip"><strong>Éanna tip:</strong> the <strong>PLAY BY PLAY</strong> tab lists every basket with the game clock. Use it to find the exact moment in your footage instead of scrubbing through the whole game.</p>
    </div>
  </article>

  <article class="lesson" id="sw-check" data-title="Checklist">
    <div class="txt">
      <h2><span class="n">10</span>Match night stats checklist</h2>
      <ul class="check" id="sw-checklist">
        <li><input type="checkbox" id="sw1"><label for="sw1">Signed in to Swish with the club login</label></li>
        <li><input type="checkbox" id="sw2"><label for="sw2">Opened the game from our starred competition</label></li>
        <li><input type="checkbox" id="sw3"><label for="sw3">Game shows <strong>Finished</strong> before using final numbers</label></li>
        <li><input type="checkbox" id="sw4"><label for="sw4">Picked 1 to 2 stats for the interview questions</label></li>
        <li><input type="checkbox" id="sw5"><label for="sw5">Stats for the graphic checked against the box score</label></li>
        <li><input type="checkbox" id="sw6"><label for="sw6">Player names spelled correctly</label></li>
        <li><input type="checkbox" id="sw7"><label for="sw7">Stat text added to highlight clips</label></li>
        <li><input type="checkbox" id="sw8"><label for="sw8">No stat posted that makes a player look bad</label></li>
      </ul>
    </div>
  </article>

  <article class="lesson two" id="mac-airdrop" data-title="AirDrop in Finder">
    <div class="txt">
      <h2><span class="n">1</span>Add AirDrop to your Finder toolbar</h2>
      <p>AirDrop is the fastest way to move a clip, a graphic or a screenshot between your MacBook and your iPhone, no cables, no uploading. Putting it in the Finder toolbar means it's always one drag away.</p>
      <h3 class="sub">Set it up (once)</h3>
      <ol>
        <li>Open <strong>Finder</strong>.</li>
        <li><strong>Right-click</strong> an empty part of the toolbar at the top of the window and choose <strong>Customise Toolbar…</strong></li>
        <li>Find <strong>AirDrop</strong> in the panel and <strong>drag it up</strong> into the toolbar, wherever you like.</li>
        <li>Click <strong>Done</strong>.</li>
      </ol>
      <h3 class="sub">Laptop to phone</h3>
      <ol>
        <li>Drag a file (or several) onto the <strong>AirDrop</strong> icon in the toolbar. You can also select it and click the icon.</li>
        <li>Pick your iPhone from the list. It lands in Photos (images and videos) or asks where to save it (other files).</li>
      </ol>
      <h3 class="sub">Phone to laptop</h3>
      <ol>
        <li>On the iPhone, select the photos or videos, tap <strong>Share</strong>, then <strong>AirDrop</strong>, and pick the MacBook.</li>
        <li>They land in the Mac's <strong>Downloads</strong> folder. Move them into the right Drive folder straight away (lesson 4).</li>
      </ol>
      <p>If a device doesn't show up: check <strong>Wi-Fi and Bluetooth</strong> are on for both, the phone is <strong>unlocked</strong> and nearby, and on the iPhone go to <span class="ui">Settings › General › AirDrop</span> and choose <strong>Contacts Only</strong> or <strong>Everyone for 10 Minutes</strong>.</p>
      <p class="tip"><strong>Éanna tip:</strong> when AirDropping from the phone, tap <strong>Options</strong> at the top of the share sheet and turn on <strong>All Photos Data</strong> to send the original file at full quality.</p>
    </div>

  </article>

  <article class="lesson two" id="mac-webapps" data-title="Websites as Mac apps">
    <div class="txt">
      <h2><span class="n">2</span>Turn websites into desktop apps</h2>
      <p>A lot of what we use is a website: the Media Calendar, this Learning hub, Canva, Myinstants, Giphy and Yarn. Installing them as <strong>web apps</strong> gives each one its own icon and its own window, so you open them like any other app instead of hunting through tabs.</p>
      <h3 class="sub">In Google Chrome</h3>
      <ol>
        <li>Open the website (signed in, if it needs a login).</li>
        <li>Click the <strong>three dots</strong> at the top right of Chrome.</li>
        <li>Go to <strong>Cast, save and share</strong>, then <strong>Install page as app…</strong></li>
        <li><strong>Rename it</strong> to something short (Media Calendar, Canva, Myinstants) and click <strong>Install</strong>.</li>
        <li>It now lives in <strong>Applications</strong> and Launchpad, and you can find it with Spotlight (<span class="ui">⌘ Space</span>). Drag it to the <strong>Dock</strong> to keep it there.</li>
      </ol>
      <h3 class="sub">In Safari</h3>
      <p>Open the website, then go to <span class="ui">File › Add to Dock…</span>, name it and click <strong>Add</strong>.</p>
      <h3 class="sub">Which sites to add</h3>
      <ul>
        <li><strong>Éanna Media Calendar</strong> and <strong>Media Learning</strong> (this site)</li>
        <li><strong>Canva</strong>: install from the Canva home page for general use. Installing from inside a design (like the scorecard in the screenshots) makes an app that opens straight into that design, which is handy for a template you use every week.</li>
        <li><strong>Myinstants</strong>, <strong>Giphy</strong> and <strong>Yarn</strong> (see the Sounds, quotes &amp; GIFs tab)</li>
        <li><strong>Google Drive</strong>, if you'd rather use it in the browser than the desktop app</li>
      </ul>
    </div>
    <figure><button class="shot"><img src="learn/mac/mac-03-chrome-menu.jpg" width="1400" height="2269" loading="lazy" alt="Chrome menu with the three dots, Cast save and share, and Install page as app highlighted"></button></figure>

  </article>

  <article class="lesson" id="mac-iphone" data-title="Websites as iPhone apps">
    <div class="txt">
      <h2><span class="n">3</span>Websites as apps on your iPhone</h2>
      <p>The same trick works on the phone, which matters most for Myinstants, Giphy and Yarn since we use them while editing in Edits.</p>
      <ol>
        <li>Open the website in <strong>Safari</strong>.</li>
        <li>Tap <strong>Share</strong> (the square with an arrow). On newer iPhones you may need to tap the <strong>⋯</strong> button first.</li>
        <li>Scroll down and tap <strong>Add to Home Screen</strong>.</li>
        <li>Rename it, leave <strong>Open as Web App</strong> on if you see it, and tap <strong>Add</strong>.</li>
      </ol>
      <p>In Chrome on iPhone it's <span class="ui">Share › Add to Home Screen</span>. Put them all in one Home Screen folder called <strong>Éanna</strong> along with Edits, Swish, Instagram and Business Suite.</p>
    </div>
  </article>

  <article class="lesson" id="mac-drive" data-title="Google Drive folders">
    <div class="txt">
      <h2><span class="n">4</span>Google Drive: where everything goes</h2>
      <p>All footage and all finished content lives in the shared Éanna <strong>Google Drive</strong>. It's split into the <strong>same categories as the Media Calendar</strong>, and every category has an <strong>Unedited</strong> and an <strong>Edited</strong> folder.</p>
      <p><a class="golink" href="https://drive.google.com/drive/folders/14Dude-K7MEd61Z1D61gFaxEvNqr3C8z_?usp=drive_link" target="_blank" rel="noopener">Open the Éanna Google Drive ↗</a></p>
      <p>On the phone, open the link in the <strong>Google Drive app</strong> and tap the star so it's under Starred. On the Mac it's also in Finder once Google Drive for desktop is installed (lesson 5), or install the link as a web app (lesson 2).</p>
      <ul class="tree">
        <li><strong>Éanna Media 2026-27</strong>
          <ul>
            <li><strong>Highlight</strong>
              <ul>
                <li><strong>Unedited</strong>
                  <ul><li>2026-10-10 Éanna v Tralee Warriors</li><li>2026-10-17 Éanna v …</li></ul>
                </li>
                <li><strong>Edited</strong>
                  <ul><li>2026-10-10 Éanna v Tralee Warriors</li></ul>
                </li>
              </ul>
            </li>
            <li><strong>Content video</strong> › Unedited / Edited</li>
            <li><strong>Game day trend</strong> › Unedited / Edited</li>
            <li><strong>Games together</strong> › Unedited / Edited</li>
            <li><strong>Carousel</strong> › Unedited / Edited</li>
          </ul>
        </li>
      </ul>
      <table class="stable">
        <tr><th>Folder</th><th>What goes in it</th></tr>
        <tr><td>Unedited</td><td>Everything straight off the camera or phone: every clip, every photo, untouched. Never edit or rename files in here, and never delete from it.</td></tr>
        <tr><td>Edited</td><td>Finished exports only, the exact files that get posted (and the Canva graphics that go with them).</td></tr>
      </table>
      <h3 class="sub">Naming</h3>
      <ul>
        <li>Inside Unedited and Edited, make <strong>one folder per shoot</strong>, named <strong>date first</strong>: <em>2026-10-10 Éanna v Tralee Warriors</em>. Year-month-day means the folders sort themselves in order.</li>
        <li>Use the <strong>same name in both</strong> Unedited and Edited, so the raw clips and the final video are easy to match up.</li>
        <li>Name exports by what they are and the format: <em>2026-10-10 Tralee highlight 9x16.mp4</em>.</li>
        <li>Pick the category the post has in the Media Calendar. If a shoot covers more than one (a highlight and a trend), put each clip where it'll be used.</li>
        <li>If a new category is added to the Calendar, add a matching folder (with Unedited and Edited inside).</li>
      </ul>
      <p class="tip"><strong>Éanna tip:</strong> if you can't find a clip in under a minute, the folder is in the wrong place. Take ten seconds to put it in the right one when you upload, and it saves everyone ten minutes later.</p>
    </div>
  </article>

  <article class="lesson" id="mac-upload" data-title="Getting footage onto Drive">
    <div class="txt">
      <h2><span class="n">5</span>Getting footage onto Drive</h2>
      <h3 class="sub">Google Drive for desktop</h3>
      <p>Install <strong>Google Drive for desktop</strong> and sign in with the account that has access to the Éanna Drive. Drive then shows up in the Finder sidebar under <strong>Locations</strong>, and you can drag files into it like any other folder. Uploads happen in the background.</p>
      <ul>
        <li>In its settings choose <strong>Stream files</strong>. Files stay in the cloud and only download when you open them, so the Drive doesn't fill your Mac.</li>
        <li>Right-click a folder and choose <strong>Available offline</strong> when you're about to edit from it, so it doesn't buffer in DaVinci.</li>
      </ul>
      <h3 class="sub">From the camera</h3>
      <ol>
        <li>Put the card in a card reader. Copy the <strong>whole card</strong> into a new folder in <strong>Unedited</strong> (named date first, as above).</li>
        <li>Wait until the upload finishes: the Google Drive icon in the menu bar stops syncing and the files show as uploaded on drive.google.com.</li>
        <li>Only then can the card be formatted <strong>in the camera</strong> for the next game.</li>
      </ol>
      <h3 class="sub">From the iPhone</h3>
      <ul>
        <li><strong>AirDrop</strong> to the Mac (lesson 1) and drag into Drive, or</li>
        <li>In the <strong>Google Drive app</strong>, open the right folder, tap <strong>+</strong> › <strong>Upload</strong> and pick the clips. Keep the app open until it's done.</li>
      </ul>
      <p class="tip"><strong>Éanna tip:</strong> upload <strong>the same day</strong> you film. If something isn't on the Drive, as far as the rest of the team is concerned, it doesn't exist.</p>
    </div>
  </article>

  <article class="lesson" id="mac-drives" data-title="Your own hard drive">
    <div class="txt">
      <h2><span class="n">6</span>Your own external hard drive</h2>
      <p>The plan is to get <strong>external hard drives</strong> so each of us has one as our own personal storage. I'll let you know as soon as they're in. Until they arrive, keep working from Google Drive and keep your Mac's storage free (lesson 7).</p>
      <h3 class="sub">How we'll use them</h3>
      <ul>
        <li><strong>Your working space.</strong> Copy the footage you're editing onto your drive and keep your DaVinci projects on it. Editing from a drive is faster than streaming from Drive and keeps your laptop free.</li>
        <li><strong>Google Drive stays the master copy.</strong> Your drive is for you; the shared Drive is for the team. Everything still goes on Drive.</li>
        <li><strong>Never the only copy.</strong> Drives get dropped, lost and fail. Nothing should exist only on your drive.</li>
      </ul>
      <h3 class="sub">Looking after it</h3>
      <ul>
        <li><strong>Label it</strong> with your name, on the drive and in its name on the Mac (Disk Utility › rename).</li>
        <li><strong>Eject it</strong> before unplugging: drag it to the Bin, or click the eject arrow next to it in the Finder sidebar. Pulling it out mid-copy can corrupt files.</li>
        <li>If it needs to work on both Mac and Windows, it should be formatted as <strong>exFAT</strong> (Disk Utility › Erase). This wipes it, so do it only when it's new.</li>
        <li>Keep it in a case, away from drinks and kit bags full of tripods.</li>
      </ul>
    </div>
  </article>

  <article class="lesson" id="mac-space" data-title="Keeping your Mac fast">
    <div class="txt">
      <h2><span class="n">7</span>Keeping your Mac fast</h2>
      <p>Video eats storage, and a nearly full Mac gets slow, especially in DaVinci. Aim to keep at least <strong>50 GB free</strong>. The Finder shows how much is free at the bottom of the window.</p>
      <ul>
        <li><strong>Check what's using space:</strong> <span class="ui">Apple menu › System Settings › General › Storage</span>.</li>
        <li><strong>Clear Downloads.</strong> AirDropped clips and app installers pile up here. A DaVinci installer alone is 4 GB (and 8 GB if both the .zip and .dmg are kept). Delete installers once the app is installed, and move clips to Drive.</li>
        <li><strong>Empty the Bin.</strong> Deleted files still take up space until you do.</li>
        <li><strong>Clear DaVinci's render cache</strong> after finishing a project: <span class="ui">Playback › Delete Render Cache › All</span>.</li>
        <li><strong>Once a project is posted</strong>, the footage is safe on Drive, so remove your local copy.</li>
      </ul>
    </div>
  </article>

<script type="module">

  {id:"canva",name:"Canva",tpl:"t-canva"},
  {id:"fun",name:"Sounds, quotes & GIFs",tpl:"t-fun"},
  {id:"camera",name:"Camera settings",tpl:"t-camera"},
  {id:"interviews",name:"Interviews",tpl:"t-interviews"},
  {id:"swish",name:"Swish stats",tpl:"t-swish"},
  {id:"mac",name:"MacBook & storage",tpl:"t-mac"},
  {id:"keys",name:"Shortcuts",tpl:"t-keys"},

function buildTabs(){
  $("#tabs").innerHTML=SECTIONS.map(s=>`<a class="tab" href="#${s.id}" data-id="${s.id}">${esc(s.name)}${s.soon?'<small>soon</small>':""}</a>`).join("");

/* Navigation: tabs switch in JS (works even where the address bar can't change, e.g. previews) */
function hashParts(){try{return (location.hash||"").slice(1).split("/")}catch(e){return []}}
let current=hashParts()[0]||"edits",pendingSub=hashParts()[1]||"";
function setHash(h){try{history.pushState(null,"","#"+h)}catch(e){}}
function go(id,sub){current=id;pendingSub=sub||"";setHash(sub?id+"/"+sub:id);render()}
function render(){
  const id=current;

  else if(sec.gallery){m.innerHTML=galleryHTML();}
  else{
    const n=SECTIONS.indexOf(sec)+1;
    m.innerHTML=`<section class="intro" style="grid-template-columns:1fr"><div><div class="kicker">Section ${n}</div><h1 class="title">${esc(sec.name)}</h1></div></section>
      <div class="soon"><span class="badge">Coming soon</span><p style="margin:0 0 6px">This section is being written. It will cover:</p><ul>${sec.soon.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  }
  m.insertAdjacentHTML("beforeend",`<p class="foot">Éanna Basketball Club media team. Something out of date or unclear? Tell Milo and it'll be updated.</p>`);
  wirePage(sec.id);
  document.title=sec.name+" · Éanna Media Learning";
  window.scrollTo(0,0);
}
function wirePage(id){
  // contents chips
  const toc=document.getElementById("toc-"+id);
  if(toc){toc.innerHTML=[...document.querySelectorAll("#main .lesson")].map((l,i)=>`<li><a href="#${id}/${l.id}" data-jump="${l.id}"><b>${i+1}</b>${esc(l.dataset.title)}</a></li>`).join("");
    toc.querySelectorAll("[data-jump]").forEach(a=>a.onclick=e=>{e.preventDefault();try{history.replaceState(null,"","#"+id+"/"+a.dataset.jump)}catch(err){}document.getElementById(a.dataset.jump).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})});}
  // sliders: any lesson with more than one screenshot
  document.querySelectorAll("#main .lesson").forEach(l=>{
    const figs=[...l.querySelectorAll(":scope > figure")];
    if(figs.length<2)return;
    l.classList.remove("two","three");l.classList.add("has-car");
    const car=document.createElement("div");car.className="carousel";
    car.innerHTML=`<button class="cbtn prev" aria-label="Previous screenshot">‹</button><div class="ctrack" tabindex="0" aria-label="Screenshots, swipe for more"></div><button class="cbtn next" aria-label="Next screenshot">›</button><div class="cfoot"><div class="cdots">${figs.map((_,i)=>`<button aria-label="Screenshot ${i+1}"></button>`).join("")}</div><span class="ccount"></span></div>`;
    figs[0].before(car);const tr=car.querySelector(".ctrack");figs.forEach(f=>tr.appendChild(f));
    const dots=[...car.querySelectorAll(".cdots button")],prev=car.querySelector(".prev"),next=car.querySelector(".next"),cnt=car.querySelector(".ccount");
    const idx=()=>Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth+16));
    const go=i=>{i=Math.max(0,Math.min(figs.length-1,i));tr.scrollTo({left:i*(tr.clientWidth+16)})};
    const upd=()=>{const i=idx();dots.forEach((d,k)=>d.setAttribute("aria-current",k===i));prev.disabled=i===0;next.disabled=i===figs.length-1;cnt.textContent=(i+1)+" / "+figs.length};
    prev.onclick=()=>go(idx()-1);next.onclick=()=>go(idx()+1);dots.forEach((d,k)=>d.onclick=()=>go(k));

  });

  document.querySelectorAll("#main .shot, #main .gitem").forEach(b=>b.onclick=()=>{

  });

  document.querySelectorAll("#main ul.check").forEach(cl=>{
    const KEY=cl.id==="edits-checklist"?"eanna-learn-edits-check":"eanna-learn-"+cl.id;let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
    cl.querySelectorAll("input").forEach(i=>{i.checked=!!st[i.id];i.closest("li").classList.toggle("done",i.checked);
      i.onchange=()=>{st[i.id]=i.checked;i.closest("li").classList.toggle("done",i.checked);try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}});
    const rb=cl.parentElement.querySelector("#resetCheck");
    if(rb)rb.onclick=()=>{st={};try{localStorage.removeItem(KEY)}catch(e){}cl.querySelectorAll("input").forEach(i=>{i.checked=false;i.closest("li").classList.remove("done")})};
  });

  // deep link to a lesson (#edits/edits-audio)
  const sub=pendingSub;pendingSub="";if(sub){const el=document.getElementById(sub);if(el)setTimeout(()=>el.scrollIntoView(),50)}
}
let lbList=[],lbI=0;
function showLb(){const im=lbList[lbI];if(!im)return;$("#lbimg").src=im.currentSrc||im.src;$("#lbimg").alt=im.alt;
  const many=lbList.length>1;$("#lbprev").hidden=!many||lbI===0;$("#lbnext").hidden=!many||lbI===lbList.length-1;$("#lbcount").textContent=many?(lbI+1)+" / "+lbList.length:""}
function openLb(list,i){lbList=list;lbI=Math.max(0,i);showLb();$("#lb").classList.add("open");$("#lbx").focus()}
$("#lbprev").onclick=e=>{e.stopPropagation();if(lbI>0){lbI--;showLb()}};
$("#lbnext").onclick=e=>{e.stopPropagation();if(lbI<lbList.length-1){lbI++;showLb()}};
document.addEventListener("keydown",e=>{if(!$("#lb").classList.contains("open"))return;if(e.key==="ArrowRight")$("#lbnext").click();if(e.key==="ArrowLeft")$("#lbprev").click()});
(()=>{let x0=null;const lb=$("#lb");lb.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});lb.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50)(dx<0?$("#lbnext"):$("#lbprev")).click()},{passive:true})})();
/* Photo gallery: every marked-up screenshot from every finished section */
function galleryHTML(){
  const secs=SECTIONS.filter(s=>s.tpl).map(s=>{
    const t=$("#"+s.tpl).content;const items=[...t.querySelectorAll(".shot img")].map(im=>{
      const l=im.closest(".lesson");const n=l&&l.querySelector("h2 .n");
      return{src:im.getAttribute("src"),alt:im.getAttribute("alt")||"",w:+im.getAttribute("width"),h:+im.getAttribute("height"),lesson:l?l.dataset.title:"",num:n?n.textContent:""}});
    return{s,items};
  }).filter(x=>x.items.length);
  const total=secs.reduce((a,x)=>a+x.items.length,0);
  return `<section class="intro" style="grid-template-columns:1fr"><div><div class="kicker">${total} screenshots</div><h1 class="title">Photo gallery</h1>
    <p class="lead">Every marked-up screenshot from the guides in one place. Tap one to see it full size, then use the arrows (or swipe) to flick through.</p></div></section>
    <div class="gfilters"><button data-f="all" aria-pressed="true">All</button>${secs.map(x=>`<button data-f="${x.s.id}" aria-pressed="false">${esc(x.s.name)}</button>`).join("")}</div>
    <div class="ggrid-all">${secs.map(x=>{const wide=x.items.every(i=>i.w>i.h);return `<section class="gsec" data-sec="${x.s.id}"><h2>${esc(x.s.name)}<small>${x.items.length} screenshots</small></h2>
      <div class="ggrid${wide?" wide":""}">${x.items.map(i=>`<button class="gitem"><span class="gimg"><img src="${esc(i.src)}" alt="${esc(i.alt)}" loading="lazy"></span><span class="gcap">${esc(i.alt.split(" with ")[0])}</span><span class="glesson">Lesson ${esc(i.num)} · ${esc(i.lesson)}</span></button>`).join("")}</div></section>`}).join("")}</div>`;
}
function closeLb(){$("#lb").classList.remove("open")}
$("#lbx").onclick=closeLb;$("#lb").onclick=e=>{if(e.target.id==="lb")closeLb()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLb()});
$("#tabs").addEventListener("click",e=>{const a=e.target.closest("a.tab");if(!a)return;e.preventDefault();go(a.dataset.id)});
document.querySelector(".brand").addEventListener("click",e=>{e.preventDefault();go("edits")});
addEventListener("popstate",()=>{const [a,b]=hashParts();const id=a||"edits";if(id!==current||b){current=id;pendingSub=b||"";render()}});

/* ---------- Sign-in: same Google login and approved list as the calendar ---------- */
const firebaseConfig={
  apiKey:"AIzaSyAsWri-GSXMJVGg1Q3eKVsOKC6JQtCTQl4",

const app=initializeApp(firebaseConfig);const auth=getAuth(app);const fdb=getFirestore(app);
const GOOGLE_ICON='<svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
function gate(state,extra){
  const g=$("#gate");g.hidden=false;const m=$("#gmsg"),a=$("#gacts");
  if(state==="loading"){m.textContent="Loading";a.innerHTML='<div class="spin" aria-hidden="true"></div>'}
  else if(state==="signin"){m.textContent=extra||"Sign in with the same Google account you use for the Media Calendar.";a.innerHTML='<button class="gbtn" id="g-in">'+GOOGLE_ICON+'Sign in with Google</button>'}

  if(b("g-in"))b("g-in").onclick=async()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});

  if(b("g-out"))b("g-out").onclick=()=>signOut(auth);

}
onAuthStateChanged(auth,async user=>{
