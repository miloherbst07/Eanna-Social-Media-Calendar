  </article>

  <article class="lesson wide" id="cv-pages" data-title="Saving templates as pages">
    <div class="txt">
      <h2><span class="n">4</span>Keeping templates as new pages for later</h2>
      <p>Another way to save ideas: keep them as pages inside one design, like our <strong>Player Stat graphics</strong> design. Open it, click the <span class="ui">+</span> <strong>Add page</strong> at the end of the pages strip, then open the <strong>Templates</strong> tab, search (e.g. "2 players") and click a template. It fills the new blank page.</p>
      <p><strong>Always add a page first.</strong> Clicking a template while you're on a page you've already designed can replace your work. Over time, the design becomes a scrapbook of layouts that anyone on the team can scroll through and copy.</p>
    </div>
    <figure><button class="shot"><img src="learn/canva/cv-08-add-page.jpg" width="1400" height="1205" loading="lazy" alt="Templates panel inside a design with add page and the pages strip highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/canva/cv-09-template-page.jpg" width="1400" height="1167" loading="lazy" alt="A template added as page 12"></button></figure>
  </article>

  <article class="lesson wide" id="cv-colour" data-title="Colours and gradients">
    <div class="txt">
      <h2><span class="n">5</span>Colours and gradients</h2>
      <p>Colour is the fastest way for a graphic to look like Éanna. Select anything, then click its colour swatch in the top bar:</p>
      <ul>
        <li><strong>Brand Kit:</strong> the club colours. Use these first.</li>
        <li><strong>Colours in this design:</strong> keep new elements matching what's already there.</li>
        <li><strong>Eyedropper:</strong> pick a colour straight from the photo, e.g. a jersey.</li>
        <li><strong>Change all:</strong> swap one colour everywhere at once, which is handy when turning a template into Éanna colours.</li>
      </ul>
      <p><strong>Gradients</strong> add depth that flat colour can't. Click the <span class="ui">+</span>, choose the <strong>Gradient</strong> tab, pick two or more colours and a style (direction). Here the background went from flat black to a white-to-purple fade, which makes the whole graphic feel brighter and lets the player stand out.</p>
    </div>
    <figure><button class="shot"><img src="learn/canva/cv-10-colours.jpg" width="1400" height="1244" loading="lazy" alt="Colour panel with add colour, eyedropper, design colours, brand kit and change all highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/canva/cv-11-gradient.jpg" width="1400" height="1167" loading="lazy" alt="Gradient tab with colours and style highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/canva/cv-12-gradient-done.jpg" width="1400" height="1145" loading="lazy" alt="The gradient applied to the background"></button></figure>
  </article>

  <article class="lesson wide" id="cv-layers" data-title="Position and layers">
    <div class="txt">
      <h2><span class="n">6</span>Position and Layers</h2>
      <p>Designs are stacked: background at the bottom, then the photo, shapes, logos and text on top. When something is hidden or you can't click it, open <strong>Position</strong> in the top bar, then the <strong>Layers</strong> tab.</p>
      <ul>
        <li>The <strong>top of the list is at the front</strong>, and the bottom is the background.</li>
        <li><strong>Drag the six dots</strong> to move a layer in front of or behind others, e.g. text behind the player for a 3D look.</li>
        <li><strong>Click a layer</strong> in the list to select it, even if it's buried behind other things.</li>
        <li><strong>Arrange</strong> has forward/backward buttons and alignment.</li>
      </ul>
    </div>
    <figure><button class="shot"><img src="learn/canva/cv-13-layers.jpg" width="1400" height="1244" loading="lazy" alt="Position panel with the Layers tab and layer list highlighted"></button></figure>
  </article>

  <article class="lesson wide" id="cv-bg" data-title="Background remover">
    <div class="txt">
      <h2><span class="n">7</span>Background Remover</h2>
      <p>Select the photo and click <strong>BG Remover</strong>. In a few seconds the gym disappears and the player sits directly on the design, which looks far more professional than a rectangle photo.</p>
      <p><strong>Sponsor logos:</strong> logos often come as JPGs with a white box around them. Upload the logo, select it and use BG Remover so only the logo is left. Then it sits cleanly on any colour. Save the cleaned version back into Uploads so nobody has to do it again.</p>
      <p class="tip"><strong>Éanna tip:</strong> before removing a background yourself, check <strong>Edited Eanna Photos w BG</strong> in Uploads (lesson 10). The cut-out may already exist.</p>
    </div>
    <figure><button class="shot"><img src="learn/canva/cv-14-bg-before.jpg" width="1400" height="1167" loading="lazy" alt="Player photo selected with BG Remover highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/canva/cv-15-bg-after.jpg" width="1400" height="1145" loading="lazy" alt="The player with the background removed"></button></figure>
  </article>

  <article class="lesson wide" id="cv-elements" data-title="Elements for depth">
    <div class="txt">
      <h2><span class="n">8</span>Elements for depth and extra materials</h2>
      <p>A graphic with just a photo and text looks flat. <strong>Elements</strong> add the extra layers that give it depth. Search for:</p>
      <ul>
        <li><strong>smoke</strong> or <strong>haze</strong> behind the player or along the bottom</li>
        <li><strong>grunge</strong>, <strong>texture</strong> or <strong>halftone</strong> for a gritty sports look</li>
        <li><strong>light rays</strong>, <strong>glow</strong> or <strong>sparks</strong> for big moments</li>
      </ul>
      <p>Then use <strong>transparency</strong> (the checkerboard button) to fade the element so it blends in rather than shouting. Around 50 to 80 usually works. Put effects behind the player in Layers so the player stays sharp in front.</p>
      <p class="tip"><strong>Éanna tip:</strong> one or two effects is enough. If you notice the smoke before the player, it's too strong.</p>
    </div>
    <figure><button class="shot"><img src="learn/canva/cv-16-elements.jpg" width="1400" height="1205" loading="lazy" alt="Elements panel with search, recently used and categories highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/canva/cv-17-smoke.jpg" width="1400" height="1167" loading="lazy" alt="Smoke elements search with smoke added at the bottom of the design"></button></figure>
    <figure><button class="shot"><img src="learn/canva/cv-18-transparency.jpg" width="1400" height="1107" loading="lazy" alt="Transparency slider set to 76"></button></figure>
  </article>

  <article class="lesson wide" id="cv-shadow" data-title="Shadows">
    <div class="txt">
      <h2><span class="n">9</span>A shadow under standing players</h2>
      <p>When a player is cut out and standing or crouching in a graphic, they can look like they're floating. A soft <strong>shadow</strong> under their feet grounds them and adds depth instantly. Look at how this template does it: a dark, blurred oval right under the feet.</p>
      <ol>
        <li>In Elements, search <strong>shadow</strong> (or "oval shadow", "floor shadow").</li>
        <li>Place it under the feet, stretch it wide and flat, and lower its transparency.</li>
        <li>In Layers, move it <strong>behind the player</strong>.</li>
      </ol>
    </div>
    <figure><button class="shot"><img src="learn/canva/cv-19-shadow.jpg" width="1400" height="1184" loading="lazy" alt="Shadow element under a cut-out player highlighted"></button></figure>
  </article>

  <article class="lesson wide" id="cv-adjust" data-title="Editing the photo">
    <div class="txt">
      <h2><span class="n">10</span>Editing the photo itself</h2>
      <p>Select the photo, click <strong>Edit</strong>, then <strong>Adjust</strong>.</p>
      <ul>
        <li><strong>When:</strong> when the photo doesn't match the graphic (too dark, too orange from gym lights, flat), or when a cut-out player looks pasted on.</li>
        <li><strong>How:</strong> start with <strong>Auto-adjust</strong>, then fine-tune. Lower <strong>Temperature</strong> to cool orange light, and raise <strong>Brightness</strong> and <strong>Contrast</strong> a little. Scroll down for <strong>Sharpness</strong> and <strong>Clarity</strong> to bring back detail in jerseys and faces.</li>
        <li><strong>Why:</strong> the player is the focus of the graphic. A bright, sharp player pops off the design, while a dull one gets lost.</li>
      </ul>
      <p>Use <strong>Element</strong> to adjust just the player, not the background, and <strong>Reset adjustments</strong> to start again.</p>
      <p class="tip"><strong>Éanna tip:</strong> if the photo was already edited in Lightroom, only make small changes here. Don't overdo sharpness: it adds a crunchy halo.</p>
    </div>
    <figure><button class="shot"><img src="learn/canva/cv-20-adjust.jpg" width="1400" height="1304" loading="lazy" alt="Adjust panel with select, auto-adjust, white balance, light settings and reset highlighted"></button></figure>
  </article>

  <article class="lesson wide" id="cv-uploads" data-title="Uploads and assets">
    <div class="txt">
      <h2><span class="n">11</span>Uploads: game folders and Éanna assets</h2>
      <p>In a design, open <strong>Uploads</strong>, then the <strong>Folders</strong> tab. <strong>Create a folder for each game or event</strong> (e.g. <em>Eanna vs Tralee 11 Oct</em>) and upload that game's photos into it, so nobody scrolls through thousands of pictures.</p>
      <ul>
        <li><strong>Eanna Canva Designs:</strong> the shapes, gradients and court lines used in Éanna posts. Reuse them so new graphics match the old ones.</li>
        <li><strong>Edited Eanna Photos w BG</strong> and <strong>Eanna Photos:</strong> player photos, with and without backgrounds.</li>
        <li><strong>Images:</strong> sponsor logos (Resync, Griffith College and more) and player cut-outs ready to drop in.</li>
        <li><strong>Videos:</strong> the green-screen player clips from media day.</li>
      </ul>
      <p><strong>Matching other posts:</strong> these assets exist so that even when we're making something new, it still looks like Éanna. When you see a graphic style we haven't done before, rebuild it using our assets and colours rather than starting completely fresh.</p>
    </div>
    <figure><button class="shot"><img src="learn/canva/cv-21-uploads.jpg" width="1400" height="1227" loading="lazy" alt="Uploads with folders and create folder highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/canva/cv-22-assets.jpg" width="1400" height="1184" loading="lazy" alt="Eanna Canva Designs assets folder"></button></figure>
    <figure><button class="shot"><img src="learn/canva/cv-23-logos.jpg" width="1400" height="1167" loading="lazy" alt="Uploaded images with sponsor logos and player cut-outs highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/canva/cv-24-videos.jpg" width="1400" height="1107" loading="lazy" alt="Uploaded green-screen videos"></button></figure>
  </article>

  <article class="lesson wide" id="cv-fade" data-title="Apps and Image Blender">
    <div class="txt">
      <h2><span class="n">12</span>Apps, especially Image Blender</h2>
      <p><strong>Apps</strong> (bottom of the left bar) are add-on tools that do things Canva can't do on its own. They're one of the most useful parts of Canva and are worth exploring. Once you've used an app it stays in the left bar, so your favourites are always one click away. The ones we use or are worth trying:</p>
      <ul>
        <li><strong>Image Blender:</strong> fades or blends photos into the design. This is the one we use most (see below).</li>
        <li><strong>Blur Background</strong> and <strong>Motion Blur:</strong> soften a busy gym behind a player, or add a sense of speed to a drive or fast break.</li>
        <li><strong>Image Outline:</strong> puts an outline around a cut-out player so they pop off the background.</li>
        <li><strong>TypeCraft</strong> and <strong>TypeCutOut:</strong> stylised and cut-out text for headlines like "FINAL SCORE".</li>
        <li><strong>Image Enhancer</strong> and <strong>AI Image Extender:</strong> clean up a low-quality photo, or extend the edges of one that's cropped too tight.</li>
      </ul>
      <p>Find more by clicking <strong>Apps</strong> and searching for what you want to do (e.g. "blur", "outline", "text effect"). Some apps or features are Pro, marked with a crown or PRO badge.</p>
      <p><strong>Image Blender</strong> is the go-to for making a photo melt into the design instead of ending in a hard edge, like the player photo fading into the purple at the bottom of a final-score graphic. Select the photo, open Image Blender and choose <strong>Fade</strong> (Blend merges two images, but it's Pro). Pick <strong>Linear</strong> to fade in one direction or <strong>Radial</strong> to fade around the edges. Drag the line on the photo to set where the fade starts and ends, adjust the <strong>Strength</strong>, then click <span class="ui">Save</span>. It makes a faded copy in your uploads and swaps it into the design, so the original photo is untouched.</p>
      <p class="tip"><strong>Éanna tip:</strong> fade toward the side where the text or stats sit. The photo then flows into the graphic and the text stays readable.</p>
    </div>
    <figure><button class="shot"><img src="learn/canva/cv-25a-apps.jpg" width="1400" height="1244" loading="lazy" alt="Image Blender opening screen with the apps bar, Blend and Fade highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/canva/cv-25-fade.jpg" width="1400" height="1227" loading="lazy" alt="Image Blender fade tools with linear and radial, strength, the fade line and save highlighted"></button></figure>
  </article>

  <article class="lesson wide" id="cv-export" data-title="Resizing and downloading">
    <div class="txt">
      <h2><span class="n">13</span>Resizing and downloading</h2>
      <p><strong>Resize</strong> (top bar) turns a post into another size. Pick <strong>Instagram Post (4:5)</strong> for the feed or a story size, then choose <span class="ui">Copy &amp; resize</span>. That makes a new copy and keeps the original safe. Check the layout afterwards, since things can shift.</p>
      <p><strong>Downloading:</strong> click <strong>Share</strong>, then <strong>Download</strong>. Use <strong>PNG</strong> for graphics (or MP4 if anything is animated), size 1080 x 1350 for Instagram, and choose <strong>This page</strong> unless you want every page.</p>
      <p class="tip"><strong>Éanna tip:</strong> save the downloaded graphic into the game's folder on the club Google Drive, then AirDrop it to your phone to post.</p>
    </div>
    <figure><button class="shot"><img src="learn/canva/cv-26-resize.jpg" width="1400" height="1167" loading="lazy" alt="Resize menu with Instagram post, mobile video and copy and resize highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/canva/cv-27-download.jpg" width="1400" height="1227" loading="lazy" alt="Download panel with file type, size, pages and download highlighted"></button></figure>
  </article>

<template id="t-camera">
  <section class="intro">
    <div>
      <div class="kicker">Section 8 · Cameras</div>
      <h1 class="title">Camera settings</h1>
      <p class="lead">This section explains how a camera works and what every important setting does, starting from zero. It then walks through every button on the club's two cameras, the <strong>Nikon Z50II</strong> (mainly photos) and the <strong>Sony FX3</strong> (mainly video), then everything about filming and shooting on an <strong>iPhone</strong>, and finishes with exact settings for each type of shoot we do.</p>
      <p class="lead">If you're new, read lessons 1 to 8 first. They make everything after them make sense. If you just need settings for tonight's game, jump to <strong>lesson 15</strong> (or lesson 14 for iPhone).</p>
    </div>
    <aside class="facts">
      <h3>At a glance</h3>
      <dl>
        <dt>Nikon Z50II</dt><dd>20.9MP APS-C. Game photos, media day, some video</dd>
        <dt>Sony FX3</dt><dd>12MP full frame. Highlights, interviews, slow motion</dd>
        <dt>iPhone</dt><dd>Trends, BTS, quick clips; lessons 12 to 14</dd>
        <dt>Ireland</dt><dd>Use 25 or 50 fps for video (lesson 6)</dd>
        <dt>Golden rule</dt><dd>Check settings before every shoot</dd>
      </dl>
    </aside>
  </section>

  <ol class="toc" id="toc-camera"></ol>

  <article class="lesson" id="cam-basics" data-title="How exposure works">
    <div class="txt">
      <h2><span class="n">1</span>How exposure works (the three settings)</h2>
      <p>A photo or video is just light hitting the camera's sensor. <strong>Exposure</strong> means how bright the picture is. Three settings control it, and each one also changes how the picture <em>looks</em>:</p>
      <table class="stable">
        <tr><th>Setting</th><th>What it does</th><th>Brighter by…</th><th>Side effect</th></tr>
        <tr><td><strong>Shutter speed</strong></td><td>How long the sensor is exposed to light, e.g. 1/1000 of a second</td><td>Slower shutter (1/250 instead of 1/1000)</td><td>Slower = more motion blur</td></tr>
        <tr><td><strong>Aperture</strong> (f-number)</td><td>How wide the hole in the lens opens</td><td>Lower f-number (f/2.8 instead of f/8)</td><td>Lower = blurrier background, less in focus</td></tr>
        <tr><td><strong>ISO</strong></td><td>How much the camera boosts the signal</td><td>Higher ISO (6400 instead of 800)</td><td>Higher = more grain (noise)</td></tr>
      </table>
      <p>Think of it like filling a bucket with water. Aperture is how wide the tap is, shutter speed is how long you leave it running, and ISO is turning up the water pressure. You can get a full bucket with any mix, but each choice has a trade-off.</p>
      <p><strong>Why this matters in a gym:</strong> indoor courts are much darker than they look to your eyes. To freeze fast players you need a fast shutter, which lets in little light, so you open the aperture as wide as it goes and raise the ISO to make up the difference. That's the basic recipe for nearly every Éanna game.</p>
      <p class="tip"><strong>Éanna tip:</strong> a bit of grain from high ISO is fine (Lightroom's Denoise fixes it). A blurry player can't be fixed. Always protect the shutter speed first.</p>
    </div>
  </article>

  <article class="lesson" id="cam-shutter" data-title="Shutter speed">
    <div class="txt">
      <h2><span class="n">2</span>Shutter speed</h2>
      <p>Shutter speed is written as a fraction of a second: 1/1000 is a thousandth of a second (very fast), 1/50 is a fiftieth (slow).</p>
      <p><strong>For photos</strong>, shutter speed decides whether movement is frozen or blurred:</p>
      <table class="stable">
        <tr><th>Shutter</th><th>Result</th><th>Use it for</th></tr>
        <tr><td>1/1000 and faster</td><td>Freezes everything, even the ball and sweat</td><td>Dunks, jump shots, blocks, fast breaks</td></tr>
        <tr><td>1/500 to 1/800</td><td>Freezes most game action</td><td>The usual game setting in a darker gym</td></tr>
        <tr><td>1/250</td><td>Freezes walking and standing players</td><td>Huddles, bench, warm-ups, celebrations</td></tr>
        <tr><td>1/60 to 1/125</td><td>Fine for still subjects only</td><td>Portraits, media day, team photos</td></tr>
        <tr><td>Slower than 1/60</td><td>Shaky unless on a tripod</td><td>Creative motion blur only</td></tr>
      </table>
      <p><strong>For video</strong>, the rule is different. Video looks most natural when the shutter is about <strong>double the frame rate</strong> (this is called the 180° rule). Too fast and movement looks choppy and stuttery; too slow and it looks smeary.</p>
      <table class="stable">
        <tr><th>Frame rate</th><th>Shutter</th></tr>
        <tr><td>25 fps</td><td>1/50</td></tr>
        <tr><td>50 fps</td><td>1/100</td></tr>
        <tr><td>100 fps (slow motion)</td><td>1/200</td></tr>
      </table>
      <p><strong>Gym lights and flicker:</strong> Ireland's electricity runs at 50Hz, so many gym lights pulse 100 times a second. If your shutter doesn't match, video gets flickering or rolling dark bands. <strong>1/50, 1/100 and 1/200 are safe</strong> in Ireland, which is another reason to stick to 25, 50 and 100 fps. For photos at fast shutter speeds, turn on <strong>flicker reduction</strong> (both cameras have it) so frames don't come out with uneven colour or brightness.</p>
    </div>
  </article>

  <article class="lesson" id="cam-aperture" data-title="Aperture">
    <div class="txt">
      <h2><span class="n">3</span>Aperture (f-number)</h2>
      <p>The aperture is the opening inside the lens. It's written as f/ followed by a number, and the confusing part is that <strong>a smaller number means a bigger opening</strong>: f/2.8 lets in far more light than f/8.</p>
      <ul>
        <li><strong>Low f-number (f/1.4 to f/4):</strong> lots of light, blurry background. The player is sharp and the crowd behind melts away. Best for games indoors and for portraits.</li>
        <li><strong>Middle (f/5.6 to f/8):</strong> more of the scene in focus. Good for team photos (everyone sharp) and outdoors.</li>
        <li><strong>High (f/11 and up):</strong> almost everything sharp, but little light. Rarely needed for us.</li>
      </ul>
      <p>Every lens has a lowest f-number it can reach, written on the lens (e.g. "f/2.8" or "f/3.5–6.3"). On zoom lenses with two numbers, the lowest number gets higher as you zoom in, so the picture gets darker zoomed in. <strong>For games, set the aperture to the lowest number your lens allows</strong> and leave it there.</p>
      <p class="tip"><strong>Éanna tip:</strong> at very low f-numbers (f/1.4 to f/2) the in-focus area is thin. For a player moving towards you, f/2.8 is safer than f/1.4 so focus doesn't miss.</p>
    </div>
  </article>

  <article class="lesson" id="cam-focal" data-title="Focal length and lenses">
    <div class="txt">
      <h2><span class="n">4</span>Focal length and lenses</h2>
      <p><strong>Focal length</strong> is the number in millimetres (mm) written on the lens. It decides how wide or tight the shot is: low numbers show more of the scene, high numbers bring things closer. A <strong>zoom lens</strong> covers a range (like 24-70mm); a <strong>prime lens</strong> is one fixed number (like 50mm).</p>
      <table class="stable">
        <tr><th>Focal length</th><th>Looks like</th><th>Use it for</th></tr>
        <tr><td>Under 24mm (wide)</td><td>Very wide; stretches things near the edges</td><td>Whole court, huddles, celebrations right in front of you, tight spaces</td></tr>
        <tr><td>24 to 35mm</td><td>Wide but natural</td><td>Behind-the-scenes, walk-outs, players and surroundings together</td></tr>
        <tr><td>50mm</td><td>Close to what the eye sees</td><td>Interviews, portraits, general shots</td></tr>
        <tr><td>70 to 85mm</td><td>Tighter, flattering for faces, softer background</td><td>Interviews, portraits, close action from the baseline</td></tr>
        <tr><td>100mm and up (telephoto)</td><td>Pulls far-away action close</td><td>Action from the far end of the court, outdoor games</td></tr>
      </table>
      <p><strong>Our 24-70mm (FX3)</strong> covers most things: 24mm for wide shots, 50 to 70mm for interviews and close-ups. Zooming in also blurs the background more, which helps in messy gyms.</p>
      <p><strong>The Nikon Z50II crops</strong> (APS-C sensor), so a lens looks about <strong>1.5 times longer</strong> on it: a 50mm lens on the Z50II frames like a 75mm lens on the FX3. That helps for action from the sideline.</p>
      <p><strong>On iPhone</strong>, the lenses roughly match: 0.5x ≈ 13mm, 1x ≈ 24mm, 2x ≈ 48mm, 3x ≈ 77mm, 5x ≈ 120mm (exact numbers vary by model).</p>
      <p class="tip"><strong>Éanna tip:</strong> on a zoom, the widest aperture can change as you zoom (e.g. f/3.5 at 16mm, f/6.3 at 50mm), so the picture gets darker zoomed in. A lens with one f-number like the 24-70mm f/2.8 stays bright all the way through.</p>
    </div>
  </article>

  <article class="lesson" id="cam-iso" data-title="ISO">
    <div class="txt">
      <h2><span class="n">5</span>ISO</h2>
      <p>ISO brightens the image after the light hits the sensor. Low ISO (100 to 400) is the cleanest; high ISO adds grain. Rough guide:</p>
      <table class="stable">
        <tr><th>Situation</th><th>Typical ISO</th></tr>
        <tr><td>Outdoors, daylight</td><td>100 to 400</td></tr>
        <tr><td>Bright indoor or a well-lit arena</td><td>800 to 3200</td></tr>
        <tr><td>Typical school or club gym, fast shutter</td><td>3200 to 12,800</td></tr>
      </table>
      <p><strong>Auto ISO</strong> lets the camera choose the ISO while you lock shutter and aperture. It's the easiest way to shoot games on the Nikon: set a maximum (e.g. 12,800) so it never goes too grainy.</p>
      <p><strong>The FX3 is special:</strong> it has <strong>dual base ISO</strong>, meaning two ISO levels where the image is cleanest. In S-Log3 these are around <strong>640 and 12,800</strong> (shown as 800 and 12,800 in Cine EI mode). So in a dark gym, ISO 12,800 on the FX3 can actually look cleaner than ISO 6400. The FX3 is excellent in low light, which is why we use it for video.</p>
    </div>
  </article>

  <article class="lesson" id="cam-wb" data-title="White balance">
    <div class="txt">
      <h2><span class="n">6</span>White balance (colour)</h2>
      <p>Different lights have different colours. Our eyes adjust automatically, cameras don't. White balance tells the camera what "white" looks like, measured in <strong>Kelvin (K)</strong>: low numbers make the picture bluer, high numbers make it warmer/oranger.</p>
      <ul>
        <li><strong>Auto (AWB):</strong> fine for photos if you shoot RAW, since you can fix it in Lightroom.</li>
        <li><strong>Set a number for video:</strong> in video, auto white balance shifts colour mid-clip as the camera moves, which looks bad and is hard to fix. Lock it.</li>
        <li><strong>Gyms</strong> are usually somewhere around 4000K to 5600K. Start at about 4500K and adjust until white jerseys and the court lines look white on the screen.</li>
        <li><strong>Best method, custom white balance:</strong> point the camera at something white (a sheet of paper, a white jersey) under the court lights and set a custom/preset white balance from it. Both cameras can do this (Nikon: preset manual "PRE"; Sony: custom setup in the WB menu).</li>
      </ul>
      <p class="tip"><strong>Éanna tip:</strong> set white balance once when you arrive at a gym and leave it for the whole game, on both cameras, so photos and video match.</p>
    </div>
  </article>

  <article class="lesson" id="cam-fps" data-title="Resolution and frame rate">
    <div class="txt">
      <h2><span class="n">7</span>Resolution, frame rate and slow motion (video)</h2>
      <p><strong>Resolution</strong> is how detailed each frame is. <strong>4K</strong> (3840×2160) has four times the detail of <strong>Full HD / 1080p</strong> (1920×1080). Shoot 4K when you can: it gives room to crop and zoom in edits, like reframing landscape footage into vertical Reels.</p>
      <p><strong>Frame rate (fps)</strong> is how many pictures per second the video records.</p>
      <table class="stable">
        <tr><th>Frame rate</th><th>Looks like</th><th>Use it for</th></tr>
        <tr><td>25 fps</td><td>Normal, cinematic</td><td>Interviews, features, most footage</td></tr>
        <tr><td>50 fps</td><td>Smooth; can be slowed to half speed</td><td>Game action, warm-ups</td></tr>
        <tr><td>100 fps (or more)</td><td>Can be slowed to quarter speed</td><td>Slow-motion dunks, celebrations, intros</td></tr>
      </table>
      <p><strong>Why 25/50/100 and not 24/30/60?</strong> Ireland and Europe use the "PAL" system and 50Hz electricity. Sticking to multiples of 25 avoids gym-light flicker and matches TV and streaming here. Pick one base rate per project and keep it, e.g. edit at 25 or 50, and shoot slow motion at 100.</p>
      <p><strong>How slow motion works:</strong> filming at 100 fps and playing it back at 25 fps makes it four times slower, and it stays smooth because there are enough real frames. Filming at 25 fps and slowing it in the edit looks choppy.</p>
    </div>
  </article>

  <article class="lesson" id="cam-focus" data-title="Focus">
    <div class="txt">
      <h2><span class="n">8</span>Focus</h2>
      <p><strong>Focus modes</strong> decide <em>when</em> the camera focuses:</p>
      <ul>
        <li><strong>AF-S (single):</strong> focuses once and locks. For still subjects: portraits, team photos, media day.</li>
        <li><strong>AF-C (continuous):</strong> keeps refocusing as the subject moves. <strong>Use this for all game action.</strong></li>
        <li><strong>AF-F (Nikon video):</strong> full-time focus while filming.</li>
        <li><strong>MF (manual):</strong> you turn the focus ring yourself. For fixed shots like a locked-off wide or a tricky interview.</li>
      </ul>
      <p><strong>AF-area modes</strong> decide <em>where</em> the camera focuses: a single small point you move, a wider zone, or <strong>auto-area with subject detection</strong>, where the camera finds people, faces and eyes by itself. Both cameras are very good at detecting people and eyes. For fast games, a <strong>wide area</strong> or <strong>tracking</strong> with <strong>people/eye detection</strong> on is the easiest and most reliable.</p>
      <p><strong>Half-press:</strong> pressing the shutter button halfway focuses; pressing fully takes the photo. Keep it half-pressed (or use AF-ON) to keep tracking a player.</p>
    </div>
  </article>

  <article class="lesson" id="cam-files" data-title="Files, colour and cards">
    <div class="txt">
      <h2><span class="n">9</span>File types, colour profiles and memory cards</h2>
      <p><strong>Photos:</strong> <strong>RAW</strong> (Nikon calls it NEF) keeps all the information the sensor captured, so you can fix brightness and colour much further in Lightroom. <strong>JPEG</strong> is smaller and ready to post, but harder to fix. We shoot <strong>RAW + JPEG</strong>: RAW for editing, JPEG for sending something quickly.</p>
      <p><strong>Video colour profiles</strong> change how colours and contrast are recorded:</p>
      <ul>
        <li><strong>Standard / normal profiles</strong> (Nikon Picture Control "Standard"; Sony <strong>S-Cinetone</strong>): look good straight out of the camera. Use these for quick turnaround content.</li>
        <li><strong>Flat</strong> (Nikon): lower contrast, a little easier to colour later.</li>
        <li><strong>Log</strong> (Nikon <strong>N-Log</strong>; Sony <strong>S-Log3</strong>): looks grey and washed out on purpose, keeping the most detail for colour grading. Only use Log if you'll colour grade in DaVinci (applying a LUT). It needs more light to look clean, so expose a little brighter.</li>
      </ul>
      <p><strong>Memory cards:</strong> 4K and slow motion write a lot of data quickly. Use fast cards (V30 or faster for the Nikon; V60/V90 SD or CFexpress Type A for the FX3). <strong>Format cards in the camera</strong> (not on a laptop) at the start of each shoot, but <strong>only after the last shoot is backed up in two places</strong>.</p>
    </div>
  </article>

  <article class="lesson" id="cam-nikon" data-title="Nikon Z50II buttons">
    <div class="txt">
      <h2><span class="n">10</span>Nikon Z50II: every button</h2>
      <p>The Z50II is a 20.9MP APS-C camera. It's light, fast (up to 30 fps bursts), and has strong people/eye tracking, so it's our main <strong>photo</strong> camera. It has <strong>no in-body stabilisation</strong>: photos rely on a VR lens, and video can use electronic VR (which crops in slightly).</p>
      <h3 class="sub">Top</h3>
      <table class="stable">
        <tr><th>Control</th><th>What it does</th></tr>
        <tr><td><strong>Power switch</strong> (around the shutter)</td><td>On / off.</td></tr>
        <tr><td><strong>Shutter-release button</strong></td><td>Half-press to focus, full press to take the photo.</td></tr>
        <tr><td><strong>Video-record button</strong> (red dot)</td><td>Starts and stops recording when the photo/video selector is on video.</td></tr>
        <tr><td><strong>ISO button</strong></td><td>Hold it and turn the main dial to change ISO; turn the sub-command dial to switch Auto ISO on/off.</td></tr>
        <tr><td><strong>Exposure compensation button</strong> (+/-)</td><td>Hold it and turn a dial to make the picture brighter or darker in P, S and A modes (or with Auto ISO in M).</td></tr>
        <tr><td><strong>Picture Control button</strong></td><td>Quick access to colour styles (Standard, Flat, Monochrome and many creative looks), with a live preview.</td></tr>
        <tr><td><strong>Main command dial</strong> (rear, top right)</td><td>Changes the main setting for the mode, e.g. shutter speed in S and M.</td></tr>
        <tr><td><strong>Photo/video selector</strong></td><td>Switches the camera between photo and video. Settings are kept separately for each.</td></tr>
        <tr><td><strong>Mode dial</strong></td><td><strong>AUTO</strong>: camera does everything. <strong>P</strong>: camera picks shutter and aperture. <strong>S</strong>: you pick shutter, camera picks aperture. <strong>A</strong>: you pick aperture, camera picks shutter. <strong>M</strong>: you pick both. <strong>U1/U2/U3</strong>: your saved setups (see tip). <strong>SCN</strong>: scene presets like Sports or Portrait.</td></tr>
        <tr><td><strong>Diopter control</strong> (by the viewfinder)</td><td>Adjusts the viewfinder sharpness to your eyesight. Turn it until the viewfinder text is sharp.</td></tr>
        <tr><td><strong>Accessory shoe</strong></td><td>Mounts a microphone, light or flash.</td></tr>
      </table>
      <h3 class="sub">Front</h3>
      <table class="stable">
        <tr><th>Control</th><th>What it does</th></tr>
        <tr><td><strong>Sub-command dial</strong></td><td>Second dial, e.g. aperture in A and M.</td></tr>
        <tr><td><strong>Fn1 and Fn2 buttons</strong> (by the lens)</td><td>Customisable shortcuts. Good uses: white balance, AF-area mode, or flicker reduction.</td></tr>
        <tr><td><strong>Flash pop-up control</strong></td><td>Raises the built-in flash. We don't use flash during games (it distracts players and is often not allowed).</td></tr>
        <tr><td><strong>Lens release button</strong></td><td>Hold it in and turn the lens to remove it.</td></tr>
        <tr><td><strong>Side ports</strong></td><td>External microphone input, headphone jack, HDMI and USB (charging the battery in the camera).</td></tr>
      </table>
      <h3 class="sub">Back</h3>
      <table class="stable">
        <tr><th>Control</th><th>What it does</th></tr>
        <tr><td><strong>Monitor mode button</strong></td><td>Chooses between viewfinder, rear screen, or auto switching when you lift the camera to your eye.</td></tr>
        <tr><td><strong>DISP</strong></td><td>Cycles what info is shown on screen (levels, histogram, clean view).</td></tr>
        <tr><td><strong>AF-ON</strong></td><td>Focuses without pressing the shutter (some photographers use this "back-button focus").</td></tr>
        <tr><td><strong>i button</strong></td><td>Quick menu of the most-used settings. The fastest way to change things.</td></tr>
        <tr><td><strong>Multi selector + OK</strong></td><td>Moves the focus point, navigates menus; OK confirms.</td></tr>
        <tr><td><strong>MENU</strong></td><td>Full menus.</td></tr>
        <tr><td><strong>Playback</strong></td><td>Review photos and videos.</td></tr>
        <tr><td><strong>Zoom in / zoom out (?)</strong></td><td>Zoom in on a photo in playback to check focus. Zoom out shows thumbnails and, when shooting, help text.</td></tr>
        <tr><td><strong>Delete</strong> (bin)</td><td>Deletes the shown photo (press twice). Avoid deleting on camera; cull in Lightroom.</td></tr>
        <tr><td><strong>Release mode / self-timer button</strong></td><td>Single shot, continuous (burst) low/high, or self-timer.</td></tr>
        <tr><td><strong>Flip-out touch screen</strong></td><td>Tap to focus/shoot, flips round for selfies and low angles.</td></tr>
        <tr><td><strong>Card/battery door</strong> (underneath)</td><td>One SD card slot and the EN-EL25a battery (roughly 230 shots per charge, so bring spares).</td></tr>
      </table>
      <p class="tip"><strong>Éanna tip:</strong> save the game setup (lesson 11) to <strong>U1</strong> and a portrait/media day setup to <strong>U2</strong>. Then switching is one turn of the mode dial, and nobody has to remember the settings.</p>
    </div>
  </article>

  <article class="lesson" id="cam-fx3" data-title="Sony FX3 buttons">
    <div class="txt">
      <h2><span class="n">11</span>Sony FX3: every button</h2>
      <p>The FX3 is a full-frame cinema camera. It has a 12MP sensor, excellent low-light performance (dual base ISO), 4K up to 120 fps, in-body stabilisation, a cooling fan for long recordings, and an XLR audio handle. It's our main <strong>video</strong> camera. It can take photos too (12MP, fine for social media), but the Nikon is better for that.</p>
      <p>Unlike the Nikon, the FX3 has <strong>no mode dial</strong>. Many buttons are numbered "custom buttons", which means each can be reassigned. Below are the labels printed on them.</p>
      <h3 class="sub">Front and top</h3>
      <table class="stable">
        <tr><th>Control</th><th>What it does</th></tr>
        <tr><td><strong>REC button</strong> (top)</td><td>Starts and stops recording. Lights red while recording.</td></tr>
        <tr><td><strong>C6 / REC button</strong> (front)</td><td>A second record button, handy when holding the camera low or by the handle.</td></tr>
        <tr><td><strong>Shutter button</strong></td><td>Takes photos in photo modes; half-press to focus.</td></tr>
        <tr><td><strong>C1 / IRIS button</strong></td><td>Shortcut for aperture (iris) by default.</td></tr>
        <tr><td><strong>W/T zoom lever</strong></td><td>Zooms power-zoom lenses; otherwise can use digital (Clear Image) zoom.</td></tr>
        <tr><td><strong>Front dial</strong></td><td>Adjusts a setting quickly (e.g. aperture).</td></tr>
        <tr><td><strong>C2 / WB button</strong></td><td>White balance.</td></tr>
        <tr><td><strong>C3 / ISO button</strong></td><td>ISO.</td></tr>
        <tr><td><strong>Multi-selector</strong> (joystick)</td><td>Moves the focus point and navigates menus.</td></tr>
        <tr><td><strong>Multi Interface Shoe</strong></td><td>Mounts the XLR handle (which also connects audio digitally).</td></tr>
        <tr><td><strong>Recording lamps</strong> (front and back)</td><td>Red tally lights so you and the subject know it's recording.</td></tr>
        <tr><td><strong>Screw holes</strong> (top and sides)</td><td>Attach accessories like a monitor or handle without a cage.</td></tr>
      </table>
      <h3 class="sub">Back</h3>
      <table class="stable">
        <tr><th>Control</th><th>What it does</th></tr>
        <tr><td><strong>Power switch</strong></td><td>On / off.</td></tr>
        <tr><td><strong>MODE button</strong></td><td>Chooses the shooting mode: Movie, S&amp;Q (slow and quick motion) or photo modes. Exposure mode (P/A/S/M or flexible) is set inside these.</td></tr>
        <tr><td><strong>MENU</strong></td><td>Full menus.</td></tr>
        <tr><td><strong>Rear dial</strong></td><td>Adjusts a setting quickly (e.g. shutter).</td></tr>
        <tr><td><strong>Control wheel</strong> (with centre button)</td><td>Turn to adjust; press edges for set functions; centre confirms.</td></tr>
        <tr><td><strong>Fn button</strong></td><td>Quick menu of key settings. The fastest way to change things.</td></tr>
        <tr><td><strong>C5 / FOCUS MAG</strong></td><td>Magnifies the image to check focus.</td></tr>
        <tr><td><strong>C4 / Delete</strong></td><td>Custom button when shooting; delete in playback.</td></tr>
        <tr><td><strong>Playback</strong></td><td>Review clips.</td></tr>
        <tr><td><strong>Flip-out touch screen</strong></td><td>Tap to focus or track a subject.</td></tr>
      </table>
      <h3 class="sub">Sides</h3>
      <table class="stable">
        <tr><th>Control</th><th>What it does</th></tr>
        <tr><td><strong>SLOT 1 / SLOT 2</strong></td><td>Two card slots, each takes CFexpress Type A or SD. Can record to both at once as a backup.</td></tr>
        <tr><td><strong>Mic jack / headphone jack</strong></td><td>3.5mm mic in (turns off the internal mic and handle) and headphones to monitor sound.</td></tr>
        <tr><td><strong>HDMI (full size), USB-C</strong></td><td>External monitor; charging and power while filming.</td></tr>
        <tr><td><strong>Ventilation outlet</strong></td><td>The cooling fan. Never cover it.</td></tr>
      </table>
      <h3 class="sub">XLR handle</h3>
      <table class="stable">
        <tr><th>Control</th><th>What it does</th></tr>
        <tr><td><strong>INPUT1 / INPUT2</strong> (XLR)</td><td>Plug in professional microphones (e.g. wireless receiver or shotgun mic).</td></tr>
        <tr><td><strong>LINE / MIC / MIC+48V</strong> switches</td><td>Match to what's plugged in. MIC+48V powers mics that need phantom power. Switch away from +48V before plugging/unplugging.</td></tr>
        <tr><td><strong>ATT</strong></td><td>Lowers the input level for loud sources.</td></tr>
        <tr><td><strong>LOW CUT</strong></td><td>Cuts low rumble (air con, crowd stomping). Good for interviews.</td></tr>
        <tr><td><strong>AUTO / MAN</strong> and <strong>AUDIO LEVEL dials</strong></td><td>Automatic or manual volume per input. Manual is best: set levels so voices peak around -12dB.</td></tr>
        <tr><td><strong>INPUT3</strong></td><td>3.5mm mic input on the handle.</td></tr>
        <tr><td><strong>INPUT SELECT</strong></td><td>Chooses which inputs go to which audio channels.</td></tr>
        <tr><td><strong>HANDLE AUDIO ON/OFF</strong></td><td>Must be ON to use the handle's inputs. When ON, the camera's built-in mic is off.</td></tr>
      </table>
      <p class="tip"><strong>Éanna tip:</strong> the FX3 lets you save setups to memory (MENU, then Shooting, then Memory). Save "Game 50p", "Slow-mo 100p" and "Interview 25p" so anyone can load the right settings in seconds.</p>
    </div>
  </article>

  <article class="lesson" id="cam-iphone-setup" data-title="iPhone: one-time setup">
    <div class="txt">
      <h2><span class="n">12</span>iPhone: one-time setup in Settings</h2>
      <p>A lot of club content is filmed on phones, and a modern iPhone is a very good camera if it's set up properly. Most of the important options aren't in the Camera app, they're in <strong>Settings &gt; Camera</strong>. Set these once. Exact names and positions can shift slightly between iPhone models and iOS versions; Pro models have a few extra options (marked <em>Pro</em>).</p>
      <table class="stable">
        <tr><th>Setting</th><th>What it does</th><th>Set it to</th></tr>
        <tr><td><strong>Formats</strong></td><td>High Efficiency (HEIF/HEVC) saves smaller files; Most Compatible (JPEG/H.264) works with older software. High Efficiency is needed for 4K at 50/60 fps and some slow-motion modes.</td><td><strong>High Efficiency</strong> (DaVinci, Edits and Lightroom all open it)</td></tr>
        <tr><td><strong>ProRAW / Resolution Control</strong> <em>Pro</em></td><td>Shoots RAW photos (like the Nikon's RAW) and full 48MP. Huge files.</td><td>Off day to day; on for media day portraits you'll edit in Lightroom</td></tr>
        <tr><td><strong>Apple ProRes / Log</strong> <em>Pro</em></td><td>Pro video formats for heavy grading. Enormous files, fill the phone fast.</td><td>Off</td></tr>
        <tr><td><strong>Record Video</strong></td><td>Resolution and frame rate for normal video.</td><td><strong>4K at 25 fps</strong> (or 50 fps for action)</td></tr>
        <tr><td><strong>Show PAL Formats</strong> (in Record Video)</td><td>Adds 25 fps options (50 fps where supported). Needed in Ireland to avoid gym-light flicker and match the cameras.</td><td><strong>On</strong></td></tr>
        <tr><td><strong>HDR Video</strong></td><td>Records extra-bright HDR video. Can look washed out or over-bright on Instagram next to other posts, and in editors.</td><td><strong>Off</strong></td></tr>
        <tr><td><strong>Auto FPS / Auto Low Light FPS</strong></td><td>Drops the frame rate in low light, which causes motion blur and mismatched clips.</td><td><strong>Off</strong></td></tr>
        <tr><td><strong>Enhanced Stabilisation</strong></td><td>Crops in a little for smoother handheld footage.</td><td>On if filming handheld while moving; off on a tripod</td></tr>
        <tr><td><strong>Lock Camera</strong></td><td>Stops the phone automatically switching between lenses mid-clip (which causes a jump).</td><td><strong>On</strong></td></tr>
        <tr><td><strong>Lock White Balance</strong></td><td>Stops colour shifting while recording.</td><td><strong>On</strong></td></tr>
        <tr><td><strong>Record Slo-mo</strong></td><td>Resolution and speed for Slo-mo mode.</td><td>1080p at 240 fps (or 120 if 240 is too dark)</td></tr>
        <tr><td><strong>Record Sound</strong></td><td>Stereo recording and audio options.</td><td>Stereo on</td></tr>
        <tr><td><strong>Preserve Settings</strong></td><td>Keeps your last mode, exposure and settings when you reopen the app.</td><td>Camera Mode, Creative Controls and Exposure Adjustment on</td></tr>
        <tr><td><strong>Grid</strong> and <strong>Level</strong></td><td>Rule-of-thirds lines and a horizon level on screen.</td><td><strong>On</strong></td></tr>
        <tr><td><strong>Use Volume Up for Burst</strong></td><td>Hold volume up to fire a burst of photos.</td><td><strong>On</strong> (great for game action)</td></tr>
        <tr><td><strong>Mirror Front Camera</strong></td><td>Flips selfie photos to match what you see.</td><td>Personal choice</td></tr>
        <tr><td><strong>Lens Correction</strong></td><td>Straightens distortion on the 0.5x and front cameras.</td><td>On</td></tr>
        <tr><td><strong>Macro Control</strong></td><td>Shows a button to stop the phone jumping into macro when close to something.</td><td>On</td></tr>
        <tr><td><strong>Prioritise Faster Shooting</strong></td><td>Keeps the shutter quick when pressed repeatedly.</td><td>On</td></tr>
        <tr><td><strong>Photographic Styles</strong></td><td>A colour look applied to every photo.</td><td>Standard (we edit later)</td></tr>
        <tr><td><strong>Camera Control</strong> (iPhone 16 and later)</td><td>The side button that opens the camera and adjusts zoom/exposure with a slide.</td><td>Personal choice; turn on "Lock Focus and Exposure" with a light press</td></tr>
        <tr><td><strong>Lens Cleaning Hints</strong> (newer iOS)</td><td>Warns when the lens looks dirty.</td><td>On</td></tr>
      </table>
      <p class="tip"><strong>Éanna tip:</strong> also free up space before a game. 4K video uses roughly 200 to 400MB a minute, and running out of storage mid-play is the most common phone mistake.</p>
    </div>
  </article>

  <article class="lesson" id="cam-iphone-app" data-title="iPhone: Camera app">
    <div class="txt">
      <h2><span class="n">13</span>iPhone: using the Camera app properly</h2>
      <h3 class="sub">Finding your way around</h3>
      <ul>
        <li><strong>Modes</strong> (Photo, Video, Slo-mo, Cinematic, Portrait, Pano, Time-lapse): swipe along the row near the shutter. On the newest iOS, Photo and Video come first and you swipe for the rest.</li>
        <li><strong>Resolution and frame rate:</strong> shown at the top of the screen in Video (e.g. "4K · 25"). Tap to change for this shot.</li>
        <li><strong>More controls</strong> (flash, Live Photo, timer, aspect ratio, exposure, styles): tap the arrow / six-dot icon or tap the active mode name again.</li>
      </ul>
      <h3 class="sub">Lenses (0.5x, 1x, 2x, 3x/5x)</h3>
      <ul>
        <li><strong>1x (main camera)</strong> is by far the best, especially indoors. Use it in gyms whenever you can.</li>
        <li><strong>0.5x (ultra wide)</strong>: great for huddles, the whole court, celebrations right in front of you. Weaker in low light.</li>
        <li><strong>2x</strong>: a crop of the main camera. Good quality, nice for portraits and interviews.</li>
        <li><strong>3x / 5x (telephoto, Pro)</strong>: gets you closer from the sideline, but needs more light and gets grainy in dark gyms.</li>
        <li>Avoid pinch-zooming between these: it's a digital zoom and loses quality. <strong>Move your feet</strong> instead.</li>
      </ul>
      <h3 class="sub">Focus and exposure</h3>
      <ol>
        <li><strong>Tap</strong> on the player to focus and set brightness there.</li>
        <li><strong>Press and hold</strong> until <strong>AE/AF LOCK</strong> appears. Now focus and brightness won't jump around when someone walks across the shot. Use this for interviews and locked-off shots.</li>
        <li><strong>Drag the sun icon</strong> up or down to brighten or darken. Slightly darker is safer than too bright: blown-out white jerseys can't be fixed.</li>
      </ol>
      <h3 class="sub">Taking action photos</h3>
      <ul>
        <li><strong>Burst:</strong> hold volume up (if turned on in Settings), or swipe the shutter button to the left and hold. Pick the best frame afterwards in Photos.</li>
        <li><strong>Live Photos</strong>: turn off for action, so the shutter is snappier.</li>
        <li><strong>Night mode</strong> (moon icon) turns on by itself in dark places and takes a longer exposure. Great for still scenes, but it blurs moving players, so turn it off for game action.</li>
        <li><strong>Flash</strong>: always off at games.</li>
      </ul>
      <h3 class="sub">Video modes</h3>
      <ul>
        <li><strong>Video:</strong> everyday filming. 4K 25 for most content, 4K 50 for game action.</li>
        <li><strong>Slo-mo:</strong> 120 or 240 fps for dunks and celebrations. Needs plenty of light; very dark gyms flicker or go grainy.</li>
        <li><strong>Cinematic:</strong> blurs the background like a pro camera, and you can change the focus point afterwards in Photos. Good for interviews and player features with steady subjects.</li>
        <li><strong>Action mode</strong> (running-figure icon in Video): extremely smooth when running alongside play or walking players out, but crops in and needs good light.</li>
        <li><strong>QuickTake:</strong> in Photo mode, hold the shutter to start recording a quick clip without switching modes.</li>
        <li><strong>Hold the phone vertical</strong> for Reels and stories, horizontal only for content that will be landscape (e.g. combined with FX3 footage in DaVinci).</li>
      </ul>
      <h3 class="sub">Manual control: Blackmagic Camera app</h3>
      <p>The built-in Camera app doesn't let you set shutter speed, ISO or white balance yourself. The free <strong>Blackmagic Camera</strong> app does, just like the FX3: you can set 25 fps with a 1/50 shutter (or 180° shutter angle), lock ISO and white balance in Kelvin, and see audio levels. It's the best option for filming games and interviews on a phone, especially in gyms with flickering lights, and footage drops straight into DaVinci or Edits.</p>
      <h3 class="sub">Audio on a phone</h3>
      <p>The built-in mics pick up the whole gym. For interviews, plug a wireless mic receiver into the phone's port (USB-C or Lightning) or use a clip-on mic, and check the sound with headphones before you start.</p>
    </div>
  </article>

  <article class="lesson" id="cam-iphone-recipes" data-title="iPhone: settings by scenario">
    <div class="txt">
      <h2><span class="n">14</span>iPhone: settings by scenario</h2>
      <table class="stable">
        <tr><th>Scenario</th><th>Mode and settings</th><th>Tips</th></tr>
        <tr><td><strong>Game action video</strong></td><td>Video, 4K 50 (PAL), 1x lens. Or Blackmagic Camera at 50 fps, 1/100 shutter.</td><td>Lock exposure on the court; rest elbows or use a monopod.</td></tr>
        <tr><td><strong>Trends and behind-the-scenes</strong></td><td>Video, 4K 25, vertical.</td><td>Enhanced Stabilisation on if moving.</td></tr>
        <tr><td><strong>Slow-motion dunks</strong></td><td>Slo-mo, 1080p 240 (120 if dark).</td><td>Get close and low; best in brighter gyms.</td></tr>
        <tr><td><strong>Interviews</strong></td><td>Video 4K 25 (or Cinematic), 1x or 2x. Blackmagic Camera: 25 fps, 1/50.</td><td>Tripod, AE/AF lock on the face, external mic.</td></tr>
        <tr><td><strong>Action photos</strong></td><td>Photo, 1x, burst with volume up, Live Photo and Night mode off.</td><td>Shoot a burst through the move and pick the sharpest.</td></tr>
        <tr><td><strong>Portraits and media day</strong></td><td>Portrait mode, 2x (or ProRAW on Pro models).</td><td>Light from the front, plain background.</td></tr>
        <tr><td><strong>Walk-outs and tunnel shots</strong></td><td>Video with Action mode, or Enhanced Stabilisation.</td><td>Walk smoothly; Action mode needs light.</td></tr>
      </table>
      <p class="tip"><strong>Éanna tip:</strong> after a shoot, AirDrop the clips to the editing laptop or upload to the club Google Drive straight away, then clear them off the phone once they're backed up.</p>
    </div>
  </article>

  <article class="lesson" id="cam-recipes" data-title="Settings for every scenario">
    <div class="txt">
      <h2><span class="n">15</span>Recommended settings for every scenario</h2>
      <p>Start from these, then adjust. If the picture is too dark, raise ISO first (protect your shutter speed). If it's too bright, lower ISO first.</p>
      <h3 class="sub">Game action photos (Nikon Z50II)</h3>
      <table class="stable">
        <tr><td>Mode</td><td><strong>M</strong> with <strong>Auto ISO</strong> on (max 12,800). Beginners can use <strong>S</strong> instead.</td></tr>
        <tr><td>Shutter</td><td>1/800 (1/1000 for dunks and fast breaks; 1/500 minimum if the gym is very dark)</td></tr>
        <tr><td>Aperture</td><td>Lowest number the lens allows</td></tr>
        <tr><td>Focus</td><td>AF-C, wide-area or auto-area, people detection on</td></tr>
        <tr><td>Release mode</td><td>Continuous high (burst). Shoot short bursts of 3 to 6 through the action.</td></tr>
        <tr><td>File</td><td>RAW + JPEG</td></tr>
        <tr><td>White balance</td><td>Auto (fix in Lightroom) or Kelvin to match video</td></tr>
        <tr><td>Other</td><td>Flicker reduction on. Edit with Denoise last in Lightroom.</td></tr>
      </table>
      <h3 class="sub">Portraits, media day and team photos (Nikon Z50II)</h3>
      <table class="stable">
        <tr><td>Mode</td><td><strong>A</strong> (aperture priority) or M</td></tr>
        <tr><td>Aperture</td><td>Single player: lowest number (blurry background). Team photo: f/5.6 to f/8 (everyone sharp).</td></tr>
        <tr><td>Shutter</td><td>1/200 or faster</td></tr>
        <tr><td>ISO</td><td>As low as the light allows (100 to 800 with lights)</td></tr>
        <tr><td>Focus</td><td>AF-S with eye detection</td></tr>
        <tr><td>Green screen</td><td>Light the green evenly, keep the player 1 to 2m in front of it so no green spills on them, f/4 to f/5.6 so the edges are sharp</td></tr>
      </table>
      <h3 class="sub">Game highlights video (Sony FX3)</h3>
      <table class="stable">
        <tr><td>Mode</td><td>Movie, manual exposure</td></tr>
        <tr><td>Format</td><td>4K, 50p, XAVC S 10-bit 4:2:2</td></tr>
        <tr><td>Shutter</td><td>1/100</td></tr>
        <tr><td>Aperture</td><td>Lowest number the lens allows</td></tr>
        <tr><td>ISO</td><td>Picture profile S-Cinetone: as needed. S-Log3: 12,800 in gyms.</td></tr>
        <tr><td>Picture profile</td><td><strong>S-Cinetone</strong> for quick turnaround; S-Log3 only if grading in DaVinci</td></tr>
        <tr><td>White balance</td><td>Set in Kelvin (start ~4500K) or custom; not auto</td></tr>
        <tr><td>Focus</td><td>AF-C with face/eye detection, or tap a player on the screen to track</td></tr>
        <tr><td>Stabilisation</td><td>On (Standard) handheld; Active for walking shots; off on a tripod</td></tr>
        <tr><td>Recording</td><td>Record to both slots as backup if two cards are in</td></tr>
      </table>
      <h3 class="sub">Slow motion (Sony FX3)</h3>
      <table class="stable">
        <tr><td>Mode</td><td>S&amp;Q, 100 fps (or 4K 100p in Movie mode and slow it in DaVinci)</td></tr>
        <tr><td>Shutter</td><td>1/200</td></tr>
        <tr><td>ISO</td><td>Needs more light (faster shutter), so raise ISO; use 12,800 in S-Log3</td></tr>
        <tr><td>Use for</td><td>Dunks, celebrations, walk-outs, intro shots. Keep it for the best moments.</td></tr>
      </table>
      <h3 class="sub">Interviews (FX3, or Z50II on video)</h3>
      <table class="stable">
        <tr><td>Format</td><td>4K, 25p</td></tr>
        <tr><td>Shutter</td><td>1/50</td></tr>
        <tr><td>Lens</td><td>24-70mm at about 50 to 70mm</td></tr>
        <tr><td>Aperture</td><td>f/2.8 to f/4 for a soft background without losing focus</td></tr>
        <tr><td>ISO</td><td>As low as possible with a light on the player</td></tr>
        <tr><td>Focus</td><td>AF-C with face/eye detection</td></tr>
        <tr><td>Audio</td><td>RØDE Wireless GO II receiver into the camera (FX3 mic jack or handle INPUT3; Nikon mic input), manual levels peaking ~-12dB, headphones on</td></tr>
        <tr><td>Setup</td><td>Tripod, camera at eye level, player slightly off-centre. See the Interviews tab.</td></tr>
      </table>
      <h3 class="sub">Video on the Nikon Z50II</h3>
      <table class="stable">
        <tr><td>Selector</td><td>Photo/video selector to video</td></tr>
        <tr><td>Format</td><td>4K 25p for normal (full width); Full HD 100p for slow motion. 4K 50p crops in further, so the shot gets tighter.</td></tr>
        <tr><td>Shutter</td><td>1/50 at 25p, 1/200 at 100p</td></tr>
        <tr><td>Picture Control</td><td>Standard (or Flat); N-Log only if grading</td></tr>
        <tr><td>Focus</td><td>AF-F or AF-C with people detection</td></tr>
        <tr><td>Stabilisation</td><td>Electronic VR on when handheld (crops slightly), plus VR on the lens</td></tr>
      </table>
      <h3 class="sub">Outdoors in daylight</h3>
      <p>Lots of light, so drop ISO to 100 to 400. For video, the shutter must stay at 1/50 or 1/100, so it can be too bright even at a high f-number. An <strong>ND filter</strong> (sunglasses for the lens) fixes that. For photos, just keep the fast shutter and let ISO drop.</p>
      <h3 class="sub">Very dark away gyms</h3>
      <p>Photos: keep 1/500 minimum, open the aperture fully, let ISO go to 12,800 or beyond and clean it with Denoise. Video: the FX3 at ISO 12,800 (high base) handles it well. Avoid the Nikon at very high video ISO if the FX3 is available.</p>
    </div>
  </article>

  <article class="lesson" id="cam-glossary" data-title="Glossary">
    <div class="txt">
      <h2><span class="n">17</span>Quick glossary</h2>
      <table class="stable">
        <tr><td><strong>APS-C / full frame</strong></td><td>Sensor sizes. Full frame (FX3) is bigger and better in low light; APS-C (Z50II) crops in, making lenses act 1.5x longer.</td></tr>
        <tr><td><strong>Burst</strong></td><td>Taking many photos per second while the button is held.</td></tr>
        <tr><td><strong>Crop</strong></td><td>When a mode uses only part of the sensor, making the shot tighter.</td></tr>
        <tr><td><strong>Depth of field</strong></td><td>How much of the scene is in focus. Low f-number = shallow.</td></tr>
        <tr><td><strong>Exposure compensation</strong></td><td>Telling auto modes to make the picture brighter (+) or darker (-).</td></tr>
        <tr><td><strong>Histogram</strong></td><td>A graph of brightness. Bunched left = too dark, crashing into the right edge = too bright.</td></tr>
        <tr><td><strong>Log / LUT</strong></td><td>Log records a flat image for grading; a LUT converts it to normal colour.</td></tr>
        <tr><td><strong>Noise / grain</strong></td><td>Speckles from high ISO.</td></tr>
        <tr><td><strong>ND filter</strong></td><td>Darkens the image so you can keep a slow video shutter in bright light.</td></tr>
        <tr><td><strong>Phantom power (+48V)</strong></td><td>Power sent to some microphones through the XLR cable.</td></tr>
        <tr><td><strong>Stabilisation (IBIS / VR)</strong></td><td>Reduces shake. IBIS is in the body (FX3); VR is in Nikon lenses, plus electronic VR for video.</td></tr>
      </table>
    </div>
  </article>

<template id="t-interviews">
  <section class="intro">
    <div>
      <div class="kicker">Section 9 · Post-game interviews</div>
      <h1 class="title">Interviews</h1>
      <p class="lead">Post-game interviews are some of our most-watched content: a player's reaction minutes after the buzzer. What matters most is <strong>speed</strong>. A good interview posted within the hour beats a perfect one posted tomorrow, so everything here is set up to be quick.</p>
      <p class="lead">There are two ways to do it: the <strong>Sony FX3</strong> for the best quality (feature interviews, big games), and the <strong>iPhone</strong> for the fastest turnaround. Both use the RØDE Wireless GO II mics.</p>
    </div>
    <aside class="facts">
      <h3>At a glance</h3>
      <dl>
        <dt>Camera</dt><dd>Sony FX3 + 24-70mm, or iPhone</dd>
        <dt>Mics</dt><dd>RØDE Wireless GO II</dd>
        <dt>Video</dt><dd>4K, 25 fps, shutter 1/50</dd>
        <dt>Format</dt><dd>3 questions, under 90 seconds, one take, no cuts</dd>
        <dt>Goal</dt><dd>Posted within an hour of the final whistle</dd>
      </dl>
    </aside>
  </section>

  <ol class="toc" id="toc-interviews"></ol>

  <article class="lesson" id="int-kit" data-title="Kit and the mics">
    <div class="txt">
      <h2><span class="n">1</span>Kit and the RØDE Wireless GO II</h2>
      <p>The <strong>Wireless GO II</strong> comes as two small <strong>transmitters</strong> (TX, worn by or held near the speaker) and one <strong>receiver</strong> (RX, plugged into the camera or phone). They come paired, so you just switch them on.</p>
      <ol>
        <li><strong>Charge everything</strong> before the game (they charge over USB-C).</li>
        <li>Turn on the receiver and transmitter(s). Wait until the lights show they're linked.</li>
        <li><strong>Clip the transmitter</strong> on the player's chest, about a hand's width below the chin, or hold it in the branded mic with the Éanna flag (as in the sample). Point it towards the mouth. Keep it off rustly jerseys and away from hair and hands.</li>
        <li><strong>Plug the receiver in:</strong> on the FX3, into the camera's mic jack or the XLR handle's INPUT3 (3.5mm) with the RØDE cable, with HANDLE AUDIO on if using the handle. On iPhone, use the RØDE cable for your phone's port (USB-C or Lightning).</li>
        <li><strong>Check levels with headphones</strong> while the player says a test sentence. Speech should peak around -12dB, never hitting the top.</li>
      </ol>
      <p><strong>Two transmitters</strong> means you can mic the player and the interviewer, or two players at once.</p>
      <p class="tip"><strong>Éanna tip:</strong> gyms are loud after a game. A mic close to the mouth is what makes the voice clear. The camera's built-in mic will mostly pick up the crowd.</p>
    </div>
  </article>

  <article class="lesson wide" id="int-fx3" data-title="FX3 interviews">
    <div class="txt">
      <h2><span class="n">2</span>On the Sony FX3</h2>
      <table class="stable">
        <tr><td><strong>Orientation</strong></td><td>Landscape. One clip gives both a landscape version and a vertical crop.</td></tr>
        <tr><td><strong>Format</strong></td><td>4K, <strong>25 fps</strong>, S-Cinetone (looks good with no grading)</td></tr>
        <tr><td><strong>Shutter</strong></td><td>1/50</td></tr>
        <tr><td><strong>Lens</strong></td><td>24-70mm, zoomed to about <strong>50 to 70mm</strong> (flattering for faces, softens the background)</td></tr>
        <tr><td><strong>Aperture</strong></td><td>f/2.8 to f/4</td></tr>
        <tr><td><strong>ISO</strong></td><td>As needed for the gym; 12,800 is clean on the FX3 if dark</td></tr>
        <tr><td><strong>White balance</strong></td><td>Locked in Kelvin, same as the game footage</td></tr>
        <tr><td><strong>Focus</strong></td><td>AF-C with face/eye detection</td></tr>
        <tr><td><strong>Support</strong></td><td>Tripod or monopod; handheld only if you're very steady</td></tr>
      </table>
      <p><strong>Framing:</strong> player from mid-chest up, eyes about a third of the way down the frame, and <strong>keep them in the centre</strong>. That way the clip can be reframed to vertical (9:16) without cutting them off. The player looks at the interviewer standing just beside the camera, not into the lens.</p>
      <p><strong>Background:</strong> a gym with people in the background is fine, and actually shows it's a real game night. The 24-70 at f/2.8 softens it. Just avoid someone walking right behind the player's head, bright lights directly behind them, and exit signs poking out of their head.</p>
    </div>
    <figure><button class="shot"><img src="learn/interviews/int-01-landscape.jpg" width="1400" height="1052" loading="lazy" alt="Landscape FX3 interview frame with the 9:16 crop area, mic flag and background highlighted"></button></figure>
    <figure><button class="shot"><img src="learn/interviews/int-02-vertical.jpg" width="700" height="1443" loading="lazy" alt="The same interview reframed to vertical"></button></figure>
  </article>

  <article class="lesson" id="int-phone" data-title="iPhone: the quick way">
    <div class="txt">
      <h2><span class="n">3</span>On the iPhone: the quick way</h2>
      <p>For most post-game reactions, the phone is the fastest route from final whistle to posted.</p>
      <ol>
        <li><strong>Before the game:</strong> RØDE receiver plugged in, Video mode, 4K 25 (see Camera settings, lesson 12), phone <strong>vertical</strong>, storage free.</li>
        <li><strong>Frame:</strong> 1x or 2x lens, player mid-chest up, centred. Hold the phone at their eye level (or use a small tripod/gimbal).</li>
        <li><strong>Lock focus and exposure:</strong> press and hold on the player's face until AE/AF LOCK shows.</li>
        <li><strong>Record:</strong> ask your questions (lesson 5).</li>
        <li><strong>Edit in Edits straight away:</strong> trim just the start and end (no cuts in the middle), and add auto captions in the Éanna text style.</li>
        <li><strong>Add the sponsor logo</strong> as an overlay (a PNG with no background, from the Canva uploads) in a corner, clear of Instagram's buttons.</li>
        <li><strong>Post</strong> straight from Edits to Instagram and Facebook, tag the player and sponsor, and mark it Posted in the Media Calendar.</li>
      </ol>
      <p class="tip"><strong>Éanna tip:</strong> save the sponsor logo and a caption template on the phone before the game, so the edit takes five minutes, not twenty.</p>
    </div>
  </article>

  <article class="lesson" id="int-vertical" data-title="Landscape to vertical">
    <div class="txt">
      <h2><span class="n">4</span>Turning landscape interviews vertical</h2>
      <p>FX3 interviews are filmed landscape, so they can be used on YouTube or in longer videos, then reframed to vertical for Reels and stories:</p>
      <ul>
        <li><strong>Quickest:</strong> AirDrop the clip to your phone, open it in Edits, and pinch to zoom until it fills the vertical frame (see Edits, lesson 5). Because the player was centred, nothing important gets cut off.</li>
        <li><strong>In DaVinci:</strong> make a vertical 1080x1920 timeline (DaVinci, lesson 5), drop the clip in and set Zoom so the player fills the frame.</li>
      </ul>
      <p>Shooting in 4K means there's enough detail left after the crop for the vertical version to still look sharp.</p>
    </div>
  </article>

  <article class="lesson" id="int-questions" data-title="Running the interview">
    <div class="txt">
      <h2><span class="n">5</span>Running the interview: 3 questions, under 90 seconds, no cuts</h2>
      <p>Our interviews are filmed in <strong>one take with no cuts</strong>, so what you record is what gets posted. That's what makes them quick. The format is always the same:</p>
      <ul>
        <li><strong>3 questions</strong></li>
        <li><strong>Under 90 seconds</strong> in total</li>
        <li><strong>Question 1 is always how they're feeling</strong>, before or after the game</li>
        <li><strong>Questions 2 and 3</strong> are a mix: a stat, how they responded to a moment, how they played, the other team, or what they need to bring to the next game</li>
      </ul>
      <h3 class="sub">Because there are no cuts</h3>
      <ul>
        <li><strong>Plan the 3 questions before you hit record.</strong> Check Swish for a stat and pick the moment you want to ask about.</li>
        <li><strong>Tell the player the format first:</strong> "Three quick questions, about a minute, keep the answers short." Answers of 20 to 25 seconds each fit under 90 seconds.</li>
        <li><strong>Start recording, wait a second, then ask.</strong> Leave a second at the end too, so the clip doesn't start or end mid-word.</li>
        <li><strong>Ask open questions</strong> that can't be answered "yes" or "no".</li>
        <li><strong>Stay quiet while they answer:</strong> no "yeah" or "mm-hmm" over them, just nod. Your questions are heard on the mic, so ask them clearly and briefly.</li>
        <li><strong>If it goes badly wrong</strong> (a phone rings, someone walks into the shot), just start again from question 1. It's only 90 seconds.</li>
        <li><strong>After a loss</strong>, keep it respectful and forward-looking, and check the player is OK to talk first.</li>
      </ul>
      <h3 class="sub">Question 1: how are they feeling?</h3>
      <p><strong>After a game</strong></p>
      <ul>
        <li>How are you feeling after that one?</li>
        <li>Big win tonight. What's the feeling in the dressing room?</li>
        <li>Tough one tonight. How are you feeling?</li>
        <li>How does it feel to get the win in front of the home crowd?</li>
        <li>That went right down to the wire. How are the nerves?</li>
        <li>How does it feel to bounce back after last week?</li>
      </ul>
      <p><strong>Before a game</strong></p>
      <ul>
        <li>How are you feeling heading into tonight?</li>
        <li>What's the mood in the camp this week?</li>
        <li>Big game tonight. How have you been preparing?</li>
      </ul>
      <h3 class="sub">Questions 2 and 3: pick two</h3>
      <p><strong>Stats</strong> (check Swish first)</p>
      <ul>
        <li>You finished with [22 points] tonight. Talk us through your game.</li>
        <li>[10 rebounds] tonight. How important was it to own the boards?</li>
        <li>The team shot [X] from three. What was working?</li>
        <li>You held them to [X] points in the second half. What changed?</li>
        <li>That's [X] wins in a row now. What's behind the run?</li>
      </ul>
      <p><strong>Responding to a moment</strong></p>
      <ul>
        <li>You were down [X] at half-time. What was said in the dressing room?</li>
        <li>They went on a run in the third. How did the team respond?</li>
        <li>Talk us through that last possession.</li>
        <li>You picked up early fouls. How did you adjust?</li>
        <li>What was the turning point tonight?</li>
      </ul>
      <p><strong>How they played</strong></p>
      <ul>
        <li>How would you rate your own performance tonight?</li>
        <li>You looked really confident out there. What's clicking for you right now?</li>
        <li>What did the team do well defensively tonight?</li>
        <li>How's the chemistry with [teammate] on the court?</li>
        <li>What did coach ask of you tonight?</li>
      </ul>
      <p><strong>The other team</strong></p>
      <ul>
        <li>[Opponent] are a strong side. What made them tough to play?</li>
        <li>How did you deal with [their key player]?</li>
        <li>What was the game plan going in against them?</li>
        <li>What did you learn from playing them last time?</li>
      </ul>
      <p><strong>The next game</strong></p>
      <ul>
        <li>What do you need to bring to next week against [opponent]?</li>
        <li>What's the one thing to work on in training this week?</li>
        <li>How do you keep this momentum going?</li>
        <li>What's the message to the supporters for next week?</li>
      </ul>
      <h3 class="sub">Example interviews</h3>
      <p><strong>After a win:</strong> "How are you feeling after that one?" Then "You finished with 22 points tonight. Talk us through your game." Then "What do you need to bring to next week against Tralee?"</p>
      <p><strong>After a loss:</strong> "Tough one tonight. How are you feeling?" Then "They went on a run in the third. How did the team respond?" Then "What's the one thing to work on in training this week?"</p>
      <p><strong>Before a game:</strong> "How are you feeling heading into tonight?" Then "What was the game plan going in against them?" Then "What's the message to the supporters?"</p>
    </div>
  </article>

    <div class="txt">

      <div class="kicker">Section 10 · Game stats</div>
      <h1 class="title">Swish stats</h1>
      <p class="lead">Swish is the official stats app for Basketball Ireland games. Every stat recorded at the scorer's table ends up here, usually within minutes of the final buzzer. We use it to check numbers for the <strong>Super League</strong>, <strong>BIDL</strong>, <strong>Division One</strong> and the <strong>U20 National Cup and League</strong>.</p>
      <p class="lead">Those numbers go three places: <strong>stat graphics</strong> in Canva, <strong>interview questions</strong>, and <strong>text on highlight clips</strong>. Getting a stat wrong in public is worse than leaving it out, so Swish is always the source we check against.</p>
    </div>
    <aside class="facts">
      <h3>At a glance</h3>
      <dl>
        <dt>App</dt><dd>Swish (iPhone and Android)</dd>
        <dt>Login</dt><dd>Club login, provided by the Content Manager</dd>
        <dt>Leagues</dt><dd>Super League, BIDL, D1, U20 National Cup and League</dd>
