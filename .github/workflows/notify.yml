name: Send notifications

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub often runs it a few minutes late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-notify.txt
      - run: pip install -r tools/requirements-notify.txt
      - run: python tools/send_notifications.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
